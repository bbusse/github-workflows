name: Write APKBUILD
description: >-
  Synthesise an APKBUILD that packages an already-built binary or tarball
  bundle, for callers that do not commit their own APKBUILD.

inputs:
  binary_name:
    description: Binary filename inside the artifact, also used as pkgname
    required: true
  version:
    description: Version to package (e.g. v1, v1-rc0); normalised into an Alpine pkgver
    required: true
  pkgrel:
    description: Alpine package release number
    required: false
    default: '0'
  pkgdesc:
    description: Short package description
    required: false
    default: ''
  pkgurl:
    description: Upstream project URL
    required: false
    default: ''
  license:
    description: SPDX license identifier
    required: false
    default: MIT
  alpine_arch:
    description: Alpine architecture name (x86_64, aarch64)
    required: true
  artifact_suffix:
    description: Suffix the downloaded artifact carries (e.g. linux-amd64-musl)
    required: true
  packager:
    description: Value written as maintainer
    required: false
    default: ''
  bundle_tarball:
    description: Package a tarball bundle instead of a bare binary
    required: false
    default: 'false'
  provides:
    description: Space-separated apk provides for the package
    required: false
    default: ''
  provider_priority:
    description: Priority used when several packages provide the same unversioned name
    required: false
    default: ''
  symlinks:
    description: Space-separated <link>=<target> pairs to create in the package
    required: false
    default: ''
  alt_subpackage:
    description: When set, provides/provider_priority/symlinks go into <pkgname>-<alt_subpackage>
    required: false
    default: ''
  working_directory:
    description: Directory to write the APKBUILD into, holding the downloaded artifact
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Write APKBUILD
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        ALPINE_ARCH: ${{ inputs.alpine_arch }}
        ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
        PACKAGER: ${{ inputs.packager }}
      run: |
        PKGVER="$(echo "${{ inputs.version }}" | awk '{ sub(/^[vV]/, ""); gsub(/-/, "_"); print }')"

        # Emit `ln -s` lines for the symlinks input. $1 is the shell variable
        # name the package function installs into, $2 an indent prefix.
        emit_symlinks() {
          local root="$1" indent="${2:-    }" pair link target
          for pair in ${{ inputs.symlinks }}; do
            link="${pair%%=*}"; target="${pair#*=}"
            echo "${indent}mkdir -p \"${root}\"$(dirname "$link")"
            echo "${indent}ln -s ${target} \"${root}\"${link}"
          done
        }
        {
          echo "pkgname=${{ inputs.binary_name }}"
          echo "pkgver=$PKGVER"
          echo "pkgrel=${{ inputs.pkgrel }}"
          echo "pkgdesc=\"${{ inputs.pkgdesc || inputs.binary_name }}\""
          echo "url=\"${{ inputs.pkgurl }}\""
          echo "arch=\"$ALPINE_ARCH\""
          echo "license=\"${{ inputs.license }}\""
          echo "maintainer=\"$PACKAGER\""
          echo 'source=""'
          echo 'options="!check !strip !tracedeps"'
          if [[ -n "${{ inputs.alt_subpackage }}" ]]; then
            echo "subpackages=\"\$pkgname-${{ inputs.alt_subpackage }}:_alt\""
          else
            if [[ -n "${{ inputs.provides }}" ]]; then
              echo "provides=\"${{ inputs.provides }}\""
            fi
            if [[ -n "${{ inputs.provider_priority }}" ]]; then
              echo "provider_priority=${{ inputs.provider_priority }}"
            fi
          fi
          echo ''
        } > APKBUILD

        if [[ "${{ inputs.bundle_tarball }}" == "true" ]]; then
          mkdir -p bundle
          tar -xzf "${{ inputs.binary_name }}-${{ inputs.artifact_suffix }}" -C bundle
          {
            echo 'package() {'
            echo "    mkdir -p \"\$pkgdir\"/usr/lib/${{ inputs.binary_name }}"
            echo "    cp -a \"\$startdir\"/bundle/${{ inputs.binary_name }}/. \"\$pkgdir\"/usr/lib/${{ inputs.binary_name }}/"
            echo "    mkdir -p \"\$pkgdir\"/usr/bin"
            echo "    ln -s /usr/lib/${{ inputs.binary_name }}/${{ inputs.binary_name }}-launcher.sh \"\$pkgdir\"/usr/bin/${{ inputs.binary_name }}"
            echo '}'
          } >> APKBUILD
        else
          mv "${{ inputs.binary_name }}-${{ inputs.artifact_suffix }}" "${{ inputs.binary_name }}"
          chmod +x "${{ inputs.binary_name }}"
          {
            echo 'package() {'
            echo "    install -Dm755 \"\$startdir/${{ inputs.binary_name }}\" \"\$pkgdir\"/usr/bin/${{ inputs.binary_name }}"
            if [[ -z "${{ inputs.alt_subpackage }}" ]]; then
              emit_symlinks '$pkgdir'
            fi
            echo '}'
          } >> APKBUILD
        fi

        # An "alternatives" subpackage: the plain package is installable
        # anywhere, and only this one claims the canonical path, so apk can
        # swap it against whatever provided that path before.
        if [[ -n "${{ inputs.alt_subpackage }}" ]]; then
          {
            echo ''
            echo '_alt() {'
            echo "    pkgdesc=\"${{ inputs.pkgdesc || inputs.binary_name }} (${{ inputs.alt_subpackage }})\""
            echo "    depends=\"\$pkgname=\$pkgver-r\$pkgrel\""
            if [[ -n "${{ inputs.provides }}" ]]; then
              echo "    provides=\"${{ inputs.provides }}\""
            fi
            if [[ -n "${{ inputs.provider_priority }}" ]]; then
              echo "    provider_priority=${{ inputs.provider_priority }}"
            fi
            emit_symlinks '$subpkgdir' '    '
            echo '}'
          } >> APKBUILD
        fi
        cat APKBUILD
