---
name: Write APKBUILD
description: >-
  Synthesise an APKBUILD that packages an already-built binary or tarball
  bundle, for callers that do not commit their own APKBUILD.

inputs:
  binary_name:
    description: Binary filename inside the artifact, also used as pkgname
    required: true
  version:
    description: Version to package (e.g. v1, v1-rc0); normalised into an Alpine pkgver
    required: true
  pkgrel:
    description: Alpine package release number
    required: false
    default: '0'
  pkgdesc:
    description: Short package description
    required: false
    default: ''
  pkgurl:
    description: Upstream project URL
    required: false
    default: ''
  license:
    description: SPDX license identifier
    required: false
    default: MIT
  alpine_arch:
    description: Alpine architecture name (x86_64, aarch64)
    required: true
  artifact_suffix:
    description: Suffix the downloaded artifact carries (e.g. linux-amd64-musl)
    required: true
  strip:
    description: Whether abuild strips the packaged binary. Defaults to false -- this path packages a prebuilt binary, possibly for another arch, and abuild's strip needs a triplet-prefixed tool that is not shipped. Strip in the job that builds the binary instead
    required: false
    default: 'false'
  packager:
    description: Value written as maintainer
    required: false
    default: ''
  bundle_tarball:
    description: Package a tarball bundle instead of a bare binary
    required: false
    default: 'false'
  provides:
    description: Space-separated apk provides for the package
    required: false
    default: ''
  provider_priority:
    description: Priority used when several packages provide the same unversioned name
    required: false
    default: ''
  symlinks:
    description: Space-separated <link>=<target> pairs to create in the package
    required: false
    default: ''
  alt_subpackage:
    description: When set, provides/provider_priority/symlinks go into <pkgname>-<alt_subpackage>
    required: false
    default: ''
  working_directory:
    description: Directory to write the APKBUILD into, holding the downloaded artifact
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Write APKBUILD
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        BINARY_NAME: ${{ inputs.binary_name }}
        VERSION: ${{ inputs.version }}
        PKGREL: ${{ inputs.pkgrel }}
        PKGDESC: ${{ inputs.pkgdesc }}
        PKGURL: ${{ inputs.pkgurl }}
        LICENSE: ${{ inputs.license }}
        ALPINE_ARCH: ${{ inputs.alpine_arch }}
        ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
        PACKAGER: ${{ inputs.packager }}
        BUNDLE_TARBALL: ${{ inputs.bundle_tarball }}
        PROVIDES: ${{ inputs.provides }}
        PROVIDER_PRIORITY: ${{ inputs.provider_priority }}
        SYMLINKS: ${{ inputs.symlinks }}
        ALT_SUBPACKAGE: ${{ inputs.alt_subpackage }}
        STRIP: ${{ inputs.strip }}
      run: |
        set -euo pipefail

        pkgver="$(printf '%s' "$VERSION" | awk '{ sub(/^[vV]/, ""); gsub(/-/, "_"); print }')"
        pkgdesc="${PKGDESC:-$BINARY_NAME}"
        artifact="${BINARY_NAME}-${ARTIFACT_SUFFIX}"

        # Emit `ln -s` lines for the symlinks input. $1 is the shell variable
        # name the package function installs into, $2 an indent prefix.
        emit_symlinks() {
          local root="$1" indent="${2:-    }" pair link target
          # shellcheck disable=SC2086 # a space-separated list of pairs
          set -- $SYMLINKS
          for pair in "$@"; do
            link="${pair%%=*}"; target="${pair#*=}"
            echo "${indent}mkdir -p \"${root}\"$(dirname "$link")"
            echo "${indent}ln -s ${target} \"${root}\"${link}"
          done
        }

        {
          echo "pkgname=${BINARY_NAME}"
          echo "pkgver=${pkgver}"
          echo "pkgrel=${PKGREL}"
          echo "pkgdesc=\"${pkgdesc}\""
          echo "url=\"${PKGURL}\""
          echo "arch=\"${ALPINE_ARCH}\""
          echo "license=\"${LICENSE}\""
          echo "maintainer=\"${PACKAGER}\""
          echo 'source=""'
          # abuild strips a committed APKBUILD's output unless told not to, so
          # a synthesized one behaves the same way. It is worth real size: an
          # unstripped rust binary carries tens of MB of symbols
          if [ "$STRIP" = "false" ]; then
            echo 'options="!check !strip !tracedeps"'
          else
            echo 'options="!check !tracedeps"'
          fi
          if [ -n "$ALT_SUBPACKAGE" ]; then
            echo "subpackages=\"\$pkgname-${ALT_SUBPACKAGE}:_alt\""
          else
            if [ -n "$PROVIDES" ]; then
              echo "provides=\"${PROVIDES}\""
            fi
            if [ -n "$PROVIDER_PRIORITY" ]; then
              echo "provider_priority=${PROVIDER_PRIORITY}"
            fi
          fi
          echo ''
        } > APKBUILD

        if [ "$BUNDLE_TARBALL" = "true" ]; then
          mkdir -p bundle
          tar -xzf "$artifact" -C bundle
          {
            echo 'package() {'
            echo "    mkdir -p \"\$pkgdir\"/usr/lib/${BINARY_NAME}"
            echo "    cp -a \"\$startdir\"/bundle/${BINARY_NAME}/. \"\$pkgdir\"/usr/lib/${BINARY_NAME}/"
            echo "    mkdir -p \"\$pkgdir\"/usr/bin"
            echo "    ln -s /usr/lib/${BINARY_NAME}/${BINARY_NAME}-launcher.sh \"\$pkgdir\"/usr/bin/${BINARY_NAME}"
            echo '}'
          } >> APKBUILD
        else
          mv "$artifact" "$BINARY_NAME"
          chmod +x "$BINARY_NAME"
          {
            echo 'package() {'
            echo "    install -Dm755 \"\$startdir/${BINARY_NAME}\" \"\$pkgdir\"/usr/bin/${BINARY_NAME}"
            if [ -z "$ALT_SUBPACKAGE" ]; then
              emit_symlinks '$pkgdir'
            fi
            echo '}'
          } >> APKBUILD
        fi

        # An "alternatives" subpackage: the plain package is installable
        # anywhere, and only this one claims the canonical path, so apk can
        # swap it against whatever provided that path before.
        if [ -n "$ALT_SUBPACKAGE" ]; then
          {
            echo ''
            echo '_alt() {'
            echo "    pkgdesc=\"${pkgdesc} (${ALT_SUBPACKAGE})\""
            echo "    depends=\"\$pkgname=\$pkgver-r\$pkgrel\""
            if [ -n "$PROVIDES" ]; then
              echo "    provides=\"${PROVIDES}\""
            fi
            if [ -n "$PROVIDER_PRIORITY" ]; then
              echo "    provider_priority=${PROVIDER_PRIORITY}"
            fi
            emit_symlinks '$subpkgdir' '    '
            echo '}'
          } >> APKBUILD
        fi

        cat APKBUILD
