---
name: Install current podman
description: >-
  Install a pinned podman-static release over the runner's podman. The Ubuntu
  runner images ship either 4.9 or 5.x depending on the image version, and 4.9
  cannot parse RUN heredocs in a Containerfile.

inputs:
  version:
    description: podman-static release tag
    required: false
    default: v6.1.3
  sha256_amd64:
    description: sha256 of podman-linux-amd64.tar.gz for the pinned version
    required: false
    default: dcfff14eae60569653c21eed75c96e5fd4140f23448637bc6e0ee75a12e1267a
  sha256_arm64:
    description: sha256 of podman-linux-arm64.tar.gz for the pinned version
    required: false
    default: 3c90aebf0ca901c1b1f198a4905bed3fd89110f2670348d5b92281ff14a94c2d

runs:
  using: composite
  steps:
    # podman-static ships current podman with crun, conmon and netavark for
    # both runner arches, pinned by checksum. Ubuntu 24.04 lets only
    # AppArmor-profiled binaries create user namespaces and the distro profile
    # covers /usr/bin/podman alone, so lift the restriction for the rootless
    # build
    - name: Install current podman
      shell: bash
      env:
        RUNNER_CPU: ${{ runner.arch }}
        VERSION: ${{ inputs.version }}
        SHA256_AMD64: ${{ inputs.sha256_amd64 }}
        SHA256_ARM64: ${{ inputs.sha256_arm64 }}
      run: |
        set -eu
        case "$RUNNER_CPU" in
        X64)   arch=amd64; sha="$SHA256_AMD64" ;;
        ARM64) arch=arm64; sha="$SHA256_ARM64" ;;
        *)
            echo "no podman-static build for $RUNNER_CPU" >&2
            exit 1
            ;;
        esac
        tmp="$(mktemp -d)"
        curl -fsSL -o "$tmp/podman.tar.gz" \
            "https://github.com/mgoltzsche/podman-static/releases/download/$VERSION/podman-linux-$arch.tar.gz"
        echo "$sha  $tmp/podman.tar.gz" | sha256sum -c -
        tar -xzf "$tmp/podman.tar.gz" -C "$tmp"
        sudo cp -r "$tmp/podman-linux-$arch/usr" "$tmp/podman-linux-$arch/etc" /
        rm -rf "$tmp"
        # podman looks for crun in /usr/bin first and finds the runner's old
        # one, which rejects the OCI spec version podman 6 writes. conmon and
        # the network helpers already resolve to the static ones
        sudo mkdir -p /etc/containers/containers.conf.d
        printf '[engine]\nruntime = "crun"\n\n[engine.runtimes]\ncrun = ["/usr/local/bin/crun"]\n' |
            sudo tee /etc/containers/containers.conf.d/50-podman-static.conf >/dev/null
        sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
        podman --version
