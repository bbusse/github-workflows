---
name: Upload a build artifact
description: >-
  actions/upload-artifact on GitHub and Forgejo alike. Forgejo serves the
  artifact API, but the action refuses every server other than github.com and
  Forgejo's runner resets GITHUB_SERVER_URL for action steps, so on Forgejo
  the same pinned release runs from a run step instead.

inputs:
  name:
    description: Artifact name
    required: false
    default: artifact
  path:
    description: Files, directories or globs to upload, one per line
    required: true
  if-no-files-found:
    description: warn, error or ignore
    required: false
    default: warn
  retention-days:
    description: Days to keep the artifact, empty for the server default
    required: false
    default: ''
  archive:
    description: Zip the files, false uploads a single file as is
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Upload artifact
      if: ${{ github.server_url == 'https://github.com' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        archive: ${{ inputs.archive }}

    - name: Upload artifact
      if: ${{ github.server_url != 'https://github.com' }}
      shell: bash
      env:
        GITHUB_SERVER_URL: https://github.com
        INPUT_NAME: ${{ inputs.name }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ARCHIVE: ${{ inputs.archive }}
        IF_NO_FILES_FOUND: ${{ inputs.if-no-files-found }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
      # Shells drop variables with a dash in the name, so env hands those
      # inputs to node directly
      run: |
        set -eu
        d="${RUNNER_TEMP:-/tmp}/upload-artifact"
        mkdir -p "$d"
        curl -fsSL https://codeload.github.com/actions/upload-artifact/tar.gz/043fb46d1a93c77aae656e7c1c64a875d1fc6a0a |
          tar -xz -C "$d" --strip-components 1
        env "INPUT_IF-NO-FILES-FOUND=$IF_NO_FILES_FOUND" \
          "INPUT_RETENTION-DAYS=$RETENTION_DAYS" \
          INPUT_COMPRESSION-LEVEL=6 \
          INPUT_INCLUDE-HIDDEN-FILES=false \
          INPUT_OVERWRITE=false \
          node "$d/dist/upload/index.js"
