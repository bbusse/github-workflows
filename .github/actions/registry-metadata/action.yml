---
name: Log in to the registry and resolve image metadata
description: >-
  Authenticate against ECR or GHCR, resolve the full repository path, and
  compute the tag set and OCI labels.

inputs:
  container_registry:
    description: One of ghcr / ecr
    required: true
  image_name:
    description: Name of the resulting image
    required: true
  image_repository:
    description: Image repository, for ghcr
    required: false
    default: ''
  image_tag:
    description: An optional explicit image tag
    required: false
    default: ''
  image_additional_tags:
    description: Comma and/or newline separated list of additional tags
    required: false
    default: ''
  aws_region:
    description: AWS region, for ecr
    required: false
    default: eu-central-1
  aws_arn_role_to_assume:
    description: Role to assume, for ecr
    required: false
    default: ''
  github_token:
    description: Token used to log in to ghcr
    required: false
    default: ''

outputs:
  repository:
    description: Full registry/repository path for the image
    value: ${{ steps.repo.outputs.repository }}
  default_tag:
    description: Ref-derived tag applied to every build
    value: ${{ steps.tag.outputs.default_tag }}
  tags:
    description: Newline-separated list of fully qualified image references
    value: ${{ steps.meta.outputs.tags }}
  labels:
    description: Newline-separated OCI labels
    value: ${{ steps.meta.outputs.labels }}

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      if: inputs.container_registry == 'ecr'
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        aws-region: ${{ inputs.aws_region }}
        role-to-assume: ${{ inputs.aws_arn_role_to_assume }}

    - name: Login to Amazon ECR
      id: ecr-login
      if: inputs.container_registry == 'ecr'
      uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

    - name: Login to GitHub Container Registry
      if: inputs.container_registry == 'ghcr'
      shell: bash
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ inputs.github_token }}
      run: |
        set -eu
        printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

    - name: Resolve registry/repo path
      id: repo
      shell: bash
      env:
        REGISTRY_KIND: ${{ inputs.container_registry }}
        ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        IMAGE_NAME: ${{ inputs.image_name }}
        IMAGE_REPOSITORY: ${{ inputs.image_repository }}
      run: |
        set -eu
        if [ "$REGISTRY_KIND" = "ecr" ]; then
          prefix="$ECR_REGISTRY"
          [ -n "$prefix" ] || { echo "ecr login produced no registry host" >&2; exit 1; }
        else
          prefix="$IMAGE_REPOSITORY"
          case "$prefix" in
            ghcr.io/*) ;;
            "") echo "image_repository is required for container_registry: ghcr" >&2; exit 1 ;;
            *)  echo "image_repository must start with ghcr.io/ (got '$prefix'); without it the push goes to docker.io" >&2; exit 1 ;;
          esac
        fi
        echo "repository=${prefix}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

    - name: Resolve default tag
      id: tag
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        set -eu
        short_sha="$(git rev-parse --short HEAD)"
        echo "default_tag=${REF_NAME////-}_${short_sha}_${RUN_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: Resolve tags and labels
      id: meta
      shell: bash
      env:
        REPOSITORY: ${{ steps.repo.outputs.repository }}
        DEFAULT_TAG: ${{ steps.tag.outputs.default_tag }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        ADDITIONAL_TAGS: ${{ inputs.image_additional_tags }}
        SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        REVISION: ${{ github.sha }}
        TITLE: ${{ inputs.image_name }}
      run: |
        set -eu

        # Every image gets the ref-derived tag, "latest", and a long-sha tag;
        # an explicit image_tag and any additional tags come on top. Order
        # decides which one lands in the version label, so the most specific
        # tag goes first. awk drops repeats while keeping that order.
        {
          if [ -n "$IMAGE_TAG" ]; then printf '%s\n' "$IMAGE_TAG"; fi
          printf '%s\n' "$DEFAULT_TAG" latest "sha-${REVISION}"
          # Composite steps run with -o pipefail, so a grep matching nothing
          # would abort the block before its closing delimiter is written.
          printf '%s' "$ADDITIONAL_TAGS" \
            | tr ',' '\n' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | { grep -v '^$' || true; }
        } | awk '!seen[$0]++' > /tmp/tags

        primary="$(head -n 1 /tmp/tags)"

        {
          echo "tags<<EOF"
          sed "s|^|${REPOSITORY}:|" /tmp/tags
          echo "EOF"
          echo "labels<<EOF"
          echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "org.opencontainers.image.revision=${REVISION}"
          echo "org.opencontainers.image.source=${SOURCE_URL}"
          echo "org.opencontainers.image.url=${SOURCE_URL}"
          echo "org.opencontainers.image.title=${TITLE}"
          echo "org.opencontainers.image.version=${primary}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        echo "resolved tags:"
        sed "s|^|  ${REPOSITORY}:|" /tmp/tags
