---
name: Log in to the registry and resolve image metadata
description: >-
  Authenticate against ECR, GHCR or the Forgejo instance running the job,
  resolve the full repository path, and compute the tag set and OCI labels.

inputs:
  container_registry:
    description: One of ghcr / ecr / forgejo
    required: true
  image_name:
    description: Name of the resulting image
    required: true
  image_repository:
    description: Image repository. Required for ghcr, for forgejo it defaults to <host>/<owner> of the instance running the job
    required: false
    default: ''
  image_tag:
    description: An optional explicit image tag
    required: false
    default: ''
  image_default_tags:
    description: Whether to apply the ref-derived tag, latest and sha-<revision>. Set false for a variant that shares a repository with the primary image and must not take latest from it
    required: false
    default: 'true'
  image_additional_tags:
    description: Comma and/or newline separated list of additional tags
    required: false
    default: ''
  aws_region:
    description: AWS region, for ecr
    required: false
    default: eu-central-1
  aws_arn_role_to_assume:
    description: Role to assume, for ecr
    required: false
    default: ''
  github_token:
    description: Token used to log in to ghcr or forgejo
    required: false
    default: ''

outputs:
  repository:
    description: Full registry/repository path for the image
    value: ${{ steps.repo.outputs.repository }}
  default_tag:
    description: Ref-derived tag applied to every build
    value: ${{ steps.tag.outputs.default_tag }}
  primary_tag:
    description: First resolved tag, and the one that is always pushed. Use this to refer to the image; default_tag is absent when image_default_tags is false
    value: ${{ steps.meta.outputs.primary_tag }}
  tags:
    description: Newline-separated list of fully qualified image references
    value: ${{ steps.meta.outputs.tags }}
  labels:
    description: Newline-separated OCI labels
    value: ${{ steps.meta.outputs.labels }}

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      if: inputs.container_registry == 'ecr'
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        aws-region: ${{ inputs.aws_region }}
        role-to-assume: ${{ inputs.aws_arn_role_to_assume }}

    - name: Login to Amazon ECR
      id: ecr-login
      if: inputs.container_registry == 'ecr'
      uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

    # A Forgejo instance's registry is on the host serving the run
    - name: Resolve registry/repo path
      id: repo
      shell: bash
      env:
        REGISTRY_KIND: ${{ inputs.container_registry }}
        ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        IMAGE_NAME: ${{ inputs.image_name }}
        IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY_OWNER: ${{ github.repository_owner }}
      run: |
        set -eu
        case "$REGISTRY_KIND" in
        ecr)
            prefix="$ECR_REGISTRY"
            [ -n "$prefix" ] || {
                echo "ecr login produced no registry host" >&2
                exit 1
            }
            ;;
        ghcr)
            prefix="$IMAGE_REPOSITORY"
            case "$prefix" in
            ghcr.io/*) ;;
            "")
                echo "image_repository is required for container_registry: ghcr" >&2
                exit 1
                ;;
            *)
                echo "image_repository must start with ghcr.io/ (got '$prefix'), without it the push goes to docker.io" >&2
                exit 1
                ;;
            esac
            ;;
        forgejo)
            host="${SERVER_URL#*://}"
            host="${host%%/*}"
            # Registry paths are lowercase, owner names need not be
            owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
            prefix="${IMAGE_REPOSITORY:-$host/$owner}"
            case "$prefix" in
            "$host"/*) ;;
            *)
                echo "image_repository must start with $host/ for container_registry: forgejo (got '$prefix')" >&2
                exit 1
                ;;
            esac
            ;;
        *)
            echo "container_registry must be one of ghcr, ecr, forgejo (got '$REGISTRY_KIND')" >&2
            exit 1
            ;;
        esac
        {
            echo "registry=${prefix%%/*}"
            echo "repository=${prefix}/${IMAGE_NAME}"
        } >>"$GITHUB_OUTPUT"

    # ghcr and Forgejo both take the run's actor and token
    - name: Log in to the registry
      if: inputs.container_registry == 'ghcr' || inputs.container_registry == 'forgejo'
      shell: bash
      env:
        REGISTRY: ${{ steps.repo.outputs.registry }}
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ inputs.github_token }}
      run: |
        set -eu
        printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

    - name: Resolve default tag
      id: tag
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        set -eu
        short_sha="$(git rev-parse --short HEAD)"
        echo "default_tag=${REF_NAME////-}_${short_sha}_${RUN_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: Resolve tags and labels
      id: meta
      shell: bash
      env:
        REPOSITORY: ${{ steps.repo.outputs.repository }}
        DEFAULT_TAG: ${{ steps.tag.outputs.default_tag }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        ADDITIONAL_TAGS: ${{ inputs.image_additional_tags }}
        DEFAULT_TAGS: ${{ inputs.image_default_tags }}
        SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        REVISION: ${{ github.sha }}
        TITLE: ${{ inputs.image_name }}
      run: |
        set -eu

        # An image gets the ref-derived tag, "latest", and a long-sha tag unless
        # image_default_tags is false -- a variant sharing a repository with the
        # primary image sets that, or the two would race for "latest". An
        # explicit image_tag and any additional tags come on top. Order
        # decides which one lands in the version label, so the most specific
        # tag goes first. awk drops repeats while keeping that order.
        {
          if [ -n "$IMAGE_TAG" ]; then printf '%s\n' "$IMAGE_TAG"; fi
          if [ "$DEFAULT_TAGS" != "false" ]; then
            printf '%s\n' "$DEFAULT_TAG" latest "sha-${REVISION}"
          fi
          # Composite steps run with -o pipefail, so a grep matching nothing
          # would abort the block before its closing delimiter is written.
          printf '%s' "$ADDITIONAL_TAGS" \
            | tr ',' '\n' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | { grep -v '^$' || true; }
        } | awk '!seen[$0]++' > /tmp/tags

        primary="$(head -n 1 /tmp/tags)"

        {
          echo "primary_tag=${primary}"
          echo "tags<<EOF"
          sed "s|^|${REPOSITORY}:|" /tmp/tags
          echo "EOF"
          echo "labels<<EOF"
          echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "org.opencontainers.image.revision=${REVISION}"
          echo "org.opencontainers.image.source=${SOURCE_URL}"
          echo "org.opencontainers.image.url=${SOURCE_URL}"
          echo "org.opencontainers.image.title=${TITLE}"
          echo "org.opencontainers.image.version=${primary}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        echo "resolved tags:"
        sed "s|^|  ${REPOSITORY}:|" /tmp/tags
