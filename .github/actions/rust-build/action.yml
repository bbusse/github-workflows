---
name: Build a Rust binary for a target
description: >-
  Install the requested Rust toolchain for a target triple, build the binary
  in release mode, and stage it under dist/ with an arch suffix.

inputs:
  toolchain:
    description: Rust toolchain to install (e.g. stable, 1.97.1)
    required: true
  target:
    description: Target triple to build for (e.g. aarch64-unknown-linux-gnu)
    required: true
  binary_name:
    description: Cargo bin target to build
    required: true
  artifact_suffix:
    description: Suffix appended to the staged filename (e.g. linux-arm64)
    required: true
  working_directory:
    description: Directory holding the crate
    required: false
    default: '.'

runs:
  using: composite
  steps:
    # rustup ships preinstalled on the GitHub-hosted Linux and macOS images,
    # so the toolchain is one command rather than a third-party action.
    - name: Install Rust toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        TARGET: ${{ inputs.target }}
      run: |
        set -eu
        rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
        rustup target add --toolchain "$TOOLCHAIN" "$TARGET"
        rustup default "$TOOLCHAIN"
        rustc --version
        cargo --version

    - name: Build release binary
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        TARGET: ${{ inputs.target }}
        BINARY_NAME: ${{ inputs.binary_name }}
      run: |
        set -eu
        cargo build --release --locked --target "$TARGET" --bin "$BINARY_NAME"

    - name: Stage artifact
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        TARGET: ${{ inputs.target }}
        BINARY_NAME: ${{ inputs.binary_name }}
        ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
      run: |
        set -eu
        mkdir -p dist
        cp "target/${TARGET}/release/${BINARY_NAME}" "dist/${BINARY_NAME}-${ARTIFACT_SUFFIX}"
        chmod +x "dist/${BINARY_NAME}-${ARTIFACT_SUFFIX}"
