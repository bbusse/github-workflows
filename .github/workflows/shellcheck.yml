---
name: ShellCheck
on:
  workflow_call:
    inputs:
      shellcheck_opts:
        description: "Flags passed to ShellCheck via SHELLCHECK_OPTS"
        required: false
        type: string
        default: "-a"
      checkout:
        description: "Whether to checkout the repository contents"
        required: false
        type: boolean
        default: true
      fetch_depth:
        description: "actions/checkout fetch-depth"
        required: false
        type: number
        default: 1

permissions:
  contents: read

jobs:
  shellcheck:
    name: Run ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: inputs.checkout == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: ${{ inputs.shellcheck_opts }}
