name: Run tests bash unit

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory where the project root is located
        required: false
        default: .
        type: string
      enabled:
        description: Enable running bash_unit tests
        required: false
        default: true
        type: boolean
      test_files:
        description: Space separated list of bash_unit test files (relative to working_directory) to run
        required: false
        default: 'tests/test_klue.sh tests/test_no_copy_mode.sh'
        type: string
      install_klue_test_deps:
        description: Install the terminal-recording toolchain (tmux, textimg, Go, Menlo font shim) needed by klue-style tests
        required: false
        default: true
        type: boolean
      build_container:
        description: Build a container image from a Containerfile/Dockerfile before running tests
        required: false
        default: false
        type: boolean
      container_image_name:
        description: Tag to build for the container image (required if build_container is true)
        required: false
        default: ''
        type: string
      container_file:
        description: Path to the Containerfile/Dockerfile to build. Defaults to Containerfile if present, else Dockerfile
        required: false
        default: ''
        type: string
      container_build_context:
        description: Build context for the container image
        required: false
        default: .
        type: string
      install_qemu_deps:
        description: Install qemu-system-x86 and OVMF firmware needed by qemu-boot-style tests
        required: false
        default: false
        type: boolean
      download_artifact_name:
        description: Name of a same-run workflow artifact to download into working_directory before running tests (e.g. a disk image produced by an earlier job in this workflow run)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test-bash-unit:
    runs-on: ubuntu-latest
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        if: inputs.enabled == true && inputs.build_container == true
        working-directory: ${{ inputs.working_directory }}
        run: |
          CONTAINER_FILE="${{ inputs.container_file }}"
          if [ -z "$CONTAINER_FILE" ]; then
            if [ -f "Containerfile" ]; then
              CONTAINER_FILE="Containerfile"
            else
              CONTAINER_FILE="Dockerfile"
            fi
          fi
          # Use the same podman-preferred executor that test suites typically
          # use to run the container, so the image ends up in the image store
          # the tests will actually look in (podman and docker keep separate
          # stores, and both are present on GitHub-hosted runners).
          if command -v podman >/dev/null 2>&1; then
            EXECUTOR=podman
          else
            EXECUTOR=docker
          fi
          "$EXECUTOR" build -t "${{ inputs.container_image_name }}" -f "$CONTAINER_FILE" "${{ inputs.container_build_context }}"

      - name: Install system dependencies
        if: inputs.enabled == true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            python3

      - name: Install klue test dependencies
        if: inputs.enabled == true && inputs.install_klue_test_deps == true
        run: |
          sudo apt-get install -y --no-install-recommends \
            tmux \
            lsof \
            jq \
            fonts-dejavu-core

      - name: Install Go
        if: inputs.enabled == true && inputs.install_klue_test_deps == true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install textimg
        if: inputs.enabled == true && inputs.install_klue_test_deps == true
        run: go install github.com/jiro4989/textimg/v3@latest

      - name: Provide default stream font path expected by klue
        if: inputs.enabled == true && inputs.install_klue_test_deps == true
        run: |
          sudo mkdir -p /System/Library/Fonts
          sudo ln -sf /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf /System/Library/Fonts/Menlo.ttc

      - name: Install qemu test dependencies
        if: inputs.enabled == true && inputs.install_qemu_deps == true
        run: |
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            ovmf

      - name: Download artifact
        if: inputs.enabled == true && inputs.download_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.download_artifact_name }}
          path: ${{ inputs.working_directory }}

      # Debug
      - name: List downloaded artifact contents
        if: inputs.enabled == true && inputs.download_artifact_name != ''
        working-directory: ${{ inputs.working_directory }}
        run: ls -la

      - name: Install bash_unit
        if: inputs.enabled == true
        run: |
          git clone --depth 1 https://github.com/pgrange/bash_unit.git /tmp/bash_unit

      - name: Tests disabled
        if: inputs.enabled != true
        run: echo "bash_unit tests are disabled"

      - name: Run bash_unit tests
        if: inputs.enabled == true
        working-directory: ${{ inputs.working_directory }}
        # bash_unit otherwise cd's into the test file's own directory
        # before running it, which breaks relative paths (like a
        # downloaded disk-image artifact) that assume working_directory
        env:
          STICK_TO_CWD: "true"
        run: |
          echo "Using TERM=${TERM}"
          for test_file in ${{ inputs.test_files }}; do
            /tmp/bash_unit/bash_unit "$test_file"
          done
