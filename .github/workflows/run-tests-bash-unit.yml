---
name: Run tests bash unit

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory where the project root is located
        required: false
        default: .
        type: string
      enabled:
        description: Enable running bash_unit tests
        required: false
        default: true
        type: boolean
      test_files:
        description: >-
          Space separated list of bash_unit test files (relative to
          working_directory) to run. Required unless enabled is false.
        required: false
        default: ''
        type: string
      bash_unit_ref:
        description: >-
          bash_unit tag or commit to check out. Pinned rather than tracking the
          default branch, because this is upstream code the runner executes.
        required: false
        default: v2.3.3
        type: string
      install_klue_test_deps:
        description: >-
          Deprecated no-op, kept so existing callers keep validating. The
          terminal-recording toolchain it used to install (tmux, textimg, Go,
          a Menlo font shim) was specific to one project and unused by every
          caller; a caller needing it should install it itself.
        required: false
        default: false
        type: boolean
      build_container:
        description: Build a container image from a Containerfile/Dockerfile before running tests
        required: false
        default: false
        type: boolean
      container_image_name:
        description: Tag to build for the container image (required if build_container is true)
        required: false
        default: ''
        type: string
      container_file:
        description: Path to the Containerfile/Dockerfile to build. Defaults to Containerfile if present, else Dockerfile
        required: false
        default: ''
        type: string
      container_build_context:
        description: Build context for the container image
        required: false
        default: .
        type: string
      install_qemu_deps:
        description: Install qemu and UEFI firmware needed by qemu-boot-style tests
        required: false
        default: false
        type: boolean
      test_arch:
        description: Target architecture for qemu-boot-style tests (amd64 or arm64) - selects qemu deps and is exported as QEMU_ARCH
        required: false
        default: amd64
        type: string
      download_artifact_name:
        description: Name of a same-run workflow artifact to download into working_directory before running tests (e.g. a disk image produced by an earlier job in this workflow run)
        required: false
        default: ''
        type: string
      use_arm_runner:
        description: Use ARM runner (ubuntu-24.04-arm) instead of ubuntu-latest - needed for qemu-boot-style arm64 tests to avoid unreliable cross-arch TCG emulation on an x86_64 host
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-bash-unit:
    name: Test bash unit
    if: ${{ inputs.enabled }}
    runs-on: ${{ inputs.use_arm_runner && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        if: ${{ inputs.build_container }}
        working-directory: ${{ inputs.working_directory }}
        env:
          CONTAINER_FILE: ${{ inputs.container_file }}
          CONTAINER_IMAGE_NAME: ${{ inputs.container_image_name }}
          CONTAINER_BUILD_CONTEXT: ${{ inputs.container_build_context }}
        run: |
          set -eu
          container_file="$CONTAINER_FILE"
          if [ -z "$container_file" ]; then
            if [ -f Containerfile ]; then
              container_file=Containerfile
            else
              container_file=Dockerfile
            fi
          fi
          # Use the same podman-preferred executor that test suites typically
          # use to run the container, so the image ends up in the image store
          # the tests will actually look in (podman and docker keep separate
          # stores, and both are present on GitHub-hosted runners).
          if command -v podman >/dev/null 2>&1; then
            executor=podman
          else
            executor=docker
          fi
          "$executor" build -t "$CONTAINER_IMAGE_NAME" -f "$container_file" "$CONTAINER_BUILD_CONTEXT"

      - name: Install system dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            python3

      - name: Install qemu test dependencies
        if: ${{ inputs.install_qemu_deps }}
        env:
          TEST_ARCH: ${{ inputs.test_arch }}
        run: |
          set -eu
          if [ "$TEST_ARCH" = "arm64" ]; then
            sudo apt-get install -y --no-install-recommends \
              qemu-system-arm \
              qemu-efi-aarch64
          else
            sudo apt-get install -y --no-install-recommends \
              qemu-system-x86 \
              ovmf
          fi

      - name: Download artifact
        if: ${{ inputs.download_artifact_name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.download_artifact_name }}
          path: ${{ inputs.working_directory }}

      # Artifact name follows disk-image-<target>-<arch>, and the file inside
      # it is <target>-<arch>.raw (see create-disk-image.yml's upload-artifact
      # step) - derive DISK_IMAGE so qemu-boot-style tests find the right image
      # without hardcoding a target here.
      - name: Derive DISK_IMAGE from downloaded artifact
        if: ${{ inputs.download_artifact_name != '' }}
        working-directory: ${{ inputs.working_directory }}
        env:
          ARTIFACT_NAME: ${{ inputs.download_artifact_name }}
        run: |
          set -eu
          ls -la
          echo "DISK_IMAGE=${ARTIFACT_NAME#disk-image-}.raw" >> "$GITHUB_ENV"

      - name: Install bash_unit
        env:
          BASH_UNIT_REF: ${{ inputs.bash_unit_ref }}
        run: |
          set -eu
          git clone --depth 1 --branch "$BASH_UNIT_REF" \
            https://github.com/pgrange/bash_unit.git /tmp/bash_unit

      - name: Run bash_unit tests
        working-directory: ${{ inputs.working_directory }}
        # bash_unit otherwise cd's into the test file's own directory before
        # running it, which breaks relative paths (like a downloaded disk-image
        # artifact) that assume working_directory.
        env:
          STICK_TO_CWD: 'true'
          QEMU_ARCH: ${{ inputs.test_arch }}
          TEST_FILES: ${{ inputs.test_files }}
        run: |
          set -eu
          echo "Using TERM=${TERM}"
          # shellcheck disable=SC2086 # a space-separated list of test files
          set -- $TEST_FILES
          [ "$#" -gt 0 ] || { echo "::error::test_files is empty" >&2; exit 1; }
          for test_file in "$@"; do
            /tmp/bash_unit/bash_unit "$test_file"
          done

  # Keeps the calling job green (rather than "skipped", which would cascade
  # into any job that needs it) when a caller switches tests off.
  tests-disabled:
    name: Test bash unit
    if: ${{ !inputs.enabled }}
    runs-on: ubuntu-latest
    steps:
      - name: Tests disabled
        run: echo "bash_unit tests are disabled"
