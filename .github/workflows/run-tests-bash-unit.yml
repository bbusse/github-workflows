---
name: Run tests bash unit

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory where the project root is located
        required: false
        default: .
        type: string
      enabled:
        description: Enable running bash_unit tests
        required: false
        default: true
        type: boolean
      test_files:
        description: >-
          Space separated list of bash_unit test files (relative to
          working_directory) to run. Required unless enabled is false.
        required: false
        default: ''
        type: string
      bash_unit_ref:
        description: >-
          bash_unit tag or commit to check out. Pinned rather than tracking the
          default branch, because this is upstream code the runner executes.
        required: false
        default: v2.3.3
        type: string
      install_klue_test_deps:
        description: >-
          Deprecated no-op, kept so existing callers keep validating. The
          terminal-recording toolchain it used to install (tmux, textimg, Go,
          a Menlo font shim) was specific to one project and unused by every
          caller; a caller needing it should install it itself.
        required: false
        default: false
        type: boolean
      apt_packages:
        description: >-
          Space separated extra apt packages the test suite needs, e.g.
          "qrencode netcat-openbsd file".
        required: false
        default: ''
        type: string
      pip_install:
        description: >-
          Argument passed to `pip install` before the tests run, e.g. ".[service]"
          to install the checked-out project with its service extras.
        required: false
        default: ''
        type: string
      stick_to_cwd:
        description: >-
          Keep bash_unit in working_directory instead of letting it cd into each
          test file's own directory. Leave true unless a suite resolves paths
          relative to its own location.
        required: false
        default: true
        type: boolean
      build_container:
        description: Build a container image from a Containerfile/Dockerfile before running tests
        required: false
        default: false
        type: boolean
      container_image_name:
        description: Tag to build for the container image (required if build_container is true)
        required: false
        default: ''
        type: string
      container_file:
        description: Path to the Containerfile/Dockerfile to build. Defaults to Containerfile if present, else Dockerfile
        required: false
        default: ''
        type: string
      container_build_context:
        description: Build context for the container image
        required: false
        default: .
        type: string
      install_qemu_deps:
        description: Install qemu and UEFI firmware needed by qemu-boot-style tests
        required: false
        default: false
        type: boolean
      test_arch:
        description: Target architecture for qemu-boot-style tests (amd64 or arm64) - selects qemu deps and is exported as QEMU_ARCH
        required: false
        default: amd64
        type: string
      download_artifact_name:
        description: Name of a same-run workflow artifact to download into working_directory before running tests (e.g. a disk image produced by an earlier job in this workflow run)
        required: false
        default: ''
        type: string
      disk_image:
        description: >-
          File inside the downloaded artifact (relative to working_directory)
          to export as DISK_IMAGE. Defaults to <target>-<arch>.raw for
          create-disk-image.yml's disk-image-<target>-<arch> artifacts; for any
          other artifact DISK_IMAGE is left unset unless this is given, so the
          suite's own default applies.
        required: false
        default: ''
        type: string
      enable_kvm:
        description: >-
          Make /dev/kvm usable by the runner user (a udev rule) when the runner
          has it, so qemu-boot-style tests can use KVM instead of TCG. GitHub's
          x86_64 Ubuntu runners have /dev/kvm, but root:kvm 0660 by default.
          A no-op where there is no /dev/kvm.
        required: false
        default: false
        type: boolean
      use_arm_runner:
        description: Use ARM runner (ubuntu-24.04-arm) instead of ubuntu-latest - needed for qemu-boot-style arm64 tests to avoid unreliable cross-arch TCG emulation on an x86_64 host
        required: false
        default: false
        type: boolean
      install_podman:
        description: >-
          Install a pinned current podman over the runner's before anything
          builds. The runner images carry podman 4.9 or 5.x depending on the
          image version, and 4.9 cannot parse RUN heredocs in a Containerfile
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-bash-unit:
    name: Test bash unit
    if: ${{ inputs.enabled }}
    runs-on: ${{ inputs.use_arm_runner && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install current podman
        if: ${{ inputs.install_podman }}
        uses: bbusse/github-workflows/.github/actions/install-podman@dev

      - name: Build container image
        if: ${{ inputs.build_container }}
        working-directory: ${{ inputs.working_directory }}
        env:
          CONTAINER_FILE: ${{ inputs.container_file }}
          CONTAINER_IMAGE_NAME: ${{ inputs.container_image_name }}
          CONTAINER_BUILD_CONTEXT: ${{ inputs.container_build_context }}
        run: |
          set -eu
          container_file="$CONTAINER_FILE"
          if [ -z "$container_file" ]; then
            if [ -f Containerfile ]; then
              container_file=Containerfile
            else
              container_file=Dockerfile
            fi
          fi
          # Use the same podman-preferred executor that test suites typically
          # use to run the container, so the image ends up in the image store
          # the tests will actually look in (podman and docker keep separate
          # stores, and both are present on GitHub-hosted runners).
          if command -v podman >/dev/null 2>&1; then
            executor=podman
          else
            executor=docker
          fi
          "$executor" build -t "$CONTAINER_IMAGE_NAME" -f "$container_file" "$CONTAINER_BUILD_CONTEXT"

      - name: Install system dependencies
        env:
          APT_PACKAGES: ${{ inputs.apt_packages }}
        run: |
          set -eu
          sudo apt-get update
          # shellcheck disable=SC2086 # a space-separated package list
          sudo apt-get install -y --no-install-recommends \
            curl \
            python3 \
            $APT_PACKAGES

      - name: Install python packages
        if: ${{ inputs.pip_install != '' }}
        working-directory: ${{ inputs.working_directory }}
        env:
          PIP_INSTALL: ${{ inputs.pip_install }}
        run: |
          set -eu
          sudo apt-get install -y --no-install-recommends python3-pip python3-venv
          python3 -m venv .venv
          # shellcheck disable=SC2086 # may name several packages or extras
          ./.venv/bin/pip install --disable-pip-version-check $PIP_INSTALL
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install qemu test dependencies
        if: ${{ inputs.install_qemu_deps }}
        env:
          TEST_ARCH: ${{ inputs.test_arch }}
        run: |
          set -eu
          if [ "$TEST_ARCH" = "arm64" ]; then
            sudo apt-get install -y --no-install-recommends \
              qemu-system-arm \
              qemu-efi-aarch64
          else
            sudo apt-get install -y --no-install-recommends \
              qemu-system-x86 \
              ovmf
          fi

      - name: Enable KVM
        if: ${{ inputs.enable_kvm }}
        uses: bbusse/github-workflows/.github/actions/enable-kvm@dev

      - name: Download artifact
        if: ${{ inputs.download_artifact_name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.download_artifact_name }}
          path: ${{ inputs.working_directory }}

      # create-disk-image.yml names its artifacts disk-image-<target>-<arch>
      # with <target>-<arch>.raw inside, so DISK_IMAGE can be derived for
      # those. Other producers (e.g. build-freebsd.yml's
      # freebsd-<release>-<arch>-<run> holding
      # freebsd-<arch>-<fs>.img) name things differently: there, export
      # nothing unless disk_image says what to use, so the suite's own default
      # stays in effect instead of being overridden with a file that does not
      # exist.
      - name: Derive DISK_IMAGE from downloaded artifact
        if: ${{ inputs.download_artifact_name != '' }}
        working-directory: ${{ inputs.working_directory }}
        env:
          ARTIFACT_NAME: ${{ inputs.download_artifact_name }}
          DISK_IMAGE_INPUT: ${{ inputs.disk_image }}
        run: |
          set -eu
          ls -la
          disk_image="$DISK_IMAGE_INPUT"
          if [ -z "$disk_image" ]; then
            case "$ARTIFACT_NAME" in
            disk-image-*) disk_image="${ARTIFACT_NAME#disk-image-}.raw" ;;
            esac
          fi
          if [ -z "$disk_image" ]; then
            echo "Leaving DISK_IMAGE to the test suite's default"
            exit 0
          fi
          if [ ! -f "$disk_image" ]; then
            echo "::error::Artifact $ARTIFACT_NAME has no $disk_image"
            exit 1
          fi
          echo "DISK_IMAGE=$disk_image" >> "$GITHUB_ENV"

      - name: Install bash_unit
        env:
          BASH_UNIT_REF: ${{ inputs.bash_unit_ref }}
        run: |
          set -eu
          git clone --depth 1 --branch "$BASH_UNIT_REF" \
            https://github.com/pgrange/bash_unit.git /tmp/bash_unit

      - name: Run bash_unit tests
        working-directory: ${{ inputs.working_directory }}
        # With stick_to_cwd, bash_unit stays in working_directory rather than
        # cd'ing into each test file's own directory, which would break relative
        # paths (like a downloaded disk-image artifact) that assume it. Suites
        # that resolve paths relative to themselves want it off.
        env:
          STICK_TO_CWD: ${{ inputs.stick_to_cwd && 'true' || 'false' }}
          QEMU_ARCH: ${{ inputs.test_arch }}
          TEST_FILES: ${{ inputs.test_files }}
        run: |
          set -eu
          echo "Using TERM=${TERM}"
          # shellcheck disable=SC2086 # a space-separated list of test files
          set -- $TEST_FILES
          [ "$#" -gt 0 ] || { echo "::error::test_files is empty" >&2; exit 1; }
          for test_file in "$@"; do
            /tmp/bash_unit/bash_unit "$test_file"
          done

  # Keeps the calling job green (rather than "skipped", which would cascade
  # into any job that needs it) when a caller switches tests off.
  tests-disabled:
    name: Test bash unit
    if: ${{ !inputs.enabled }}
    runs-on: ubuntu-latest
    steps:
      - name: Tests disabled
        run: echo "bash_unit tests are disabled"
