---
name: Build Alpine RPi

on:
  workflow_call:
    inputs:
      flavour:
        description: Alpine target flavour (sway|containeros)
        required: true
        type: string
      image_builder_ref:
        description: Branch/tag for OpsBoost/image-builder
        required: false
        default: dev
        type: string

      use_arm_runner:
        description: Use ARM runner (ubuntu-24.04-arm) instead of ubuntu-latest
        required: false
        default: false
        type: boolean
permissions:
  contents: read

jobs:
  build-alpine-rpi:
    name: Build Alpine RPi ${{ inputs.flavour }} (${{ matrix.board_arch }})
    runs-on: ${{ inputs.use_arm_runner && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # aarch64: Pi 3/4/5 (64bit). armhf: Pi Zero/Zero W/1 (ARMv6,
        # cannot run aarch64 or armv7 code at all)
        board_arch: [aarch64, armhf]
    steps:
      - name: Aggressive cleanup
        uses: bbusse/github-workflows/.github/actions/aggressive-cleanup@dev

      - name: Checkout image-builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpsBoost/image-builder
          ref: ${{ inputs.image_builder_ref }}
          path: image-builder

      - name: Build
        env:
          ALPINE_ARCH: ${{ matrix.board_arch }}
          FLAVOUR: ${{ inputs.flavour }}
        run: |
          set -eu
          sudo ./image-builder/image-builder install
          sudo -E image-builder create "alpine-${FLAVOUR}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpine-rpi-${{ inputs.flavour }}-${{ matrix.board_arch }}-${{ github.run_number }}
          path: |
            alpine.img.xz
            alpine.img.xz.sha384
