name: Extract and release build artifact

on:
  workflow_call:
    inputs:
      filename:
        description: Artifact filename to extract (e.g., gentoo-stage4-containeros-amd64.tar.xz)
        required: true
        type: string
      image:
        description: Full container image reference (e.g., ghcr.io/org/image:tag)
        required: true
        type: string
      release:
        description: Create a GitHub Release and attach the artifact
        required: false
        default: false
        type: boolean
      release_tag:
        description: Tag name to use for the Release (e.g., v1.0.0)
        required: false
        type: string
      release_name:
        description: Release title (defaults to tag)
        required: false
        type: string
      wait-for-job:
        description: >-
          Regexp of the check to wait for before extracting, for callers
          whose build runs in a separate workflow. Leave empty when the
          caller already orders this job with needs: - the wait step is
          then skipped rather than polling for a check that is complete.
        required: false
        default: ''
        type: string
      use_arm_runner:
        description: Use ARM runner
        required: false
        default: false
        type: boolean
      platform:
        description: Platform for container extraction (e.g., linux/amd64)
        required: false
        default: linux/amd64
        type: string
    secrets:
      GH_TOKEN:
        description: Token for checking statuses
        required: true

permissions:
  contents: write

jobs:
  extract-artifacts:
    name: Extract artifact (${{ inputs.platform }})
    runs-on: ${{ inputs.use_arm_runner && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Wait for container release
        if: inputs.wait-for-job != ''
        uses: lewagon/wait-on-check-action@2271c86c146b96545b4e871b855e10ffa6f50773 # v1.9.0
        with:
          ref: ${{ github.ref }}
          check-regexp: ${{ inputs.wait-for-job }}
          repo-token: ${{ secrets.GH_TOKEN }}
          wait-interval: 10

      - name: Extract build artifact from build container
        uses: bbusse/container-extract@075e1460e324b269cae4546ebb542ff5672bd328 # v1
        id: extract
        with:
          image: ${{ inputs.image }}
          paths: ${{ inputs.filename }}
          platform: ${{ inputs.platform }}

      - name: Move extracted artifact
        run: mv "${{ steps.extract.outputs.destination }}/${{ inputs.filename }}" "${{ inputs.filename }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.filename }}
          path: ${{ inputs.filename }}

      - name: Create GitHub Release (optional)
        if: ${{ inputs.release == true }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_name || inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ inputs.filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
