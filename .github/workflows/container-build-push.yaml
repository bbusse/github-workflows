---
name: Build Container And Push To Registry

on:
  workflow_call:
    inputs:
      prefix:
        type: string
        description: A custom prefix
        required: false
      image_name:
        type: string
        description: A name for the resulting image
        required: true
      image_tag:
        type: string
        description: An optional image tag
        default: ''
      image_additional_tags:
        type: string
        description: A comma and/or newline separated list of additional tags to apply to the image
        required: false
        default: ''
      image_repository:
        type: string
        description: The image repository
        required: false
      aws_region:
        type: string
        required: false
        default: eu-central-1
      aws_arn_role_to_assume:
        type: string
        required: false
      image_platforms:
        type: string
        description: The target platforms to build for
        required: false
        default: linux/amd64,linux/arm64
      # We set a default in an action
      container_file:
        type: string
        description: The build recipe
        required: false
      container_build_context:
        type: string
        description: The path to the Containerfile
        required: false
        default: "."
      container_push_to_registry:
        type: boolean
        description: If to push to registry
        required: true
        default: true
      container_registry:
        type: string
        description: The container registry to push to, one of ghcr / ecr
        required: false
        default: 'ecr'
      build_args:
        type: string
        description: >-
          Newline-separated KEY=VALUE build arguments, for recipes that build
          more than one image out of one Containerfile.
        required: false
        default: ''
      use_arm_runner:
        description: Use ARM runner (ubuntu-24.04-arm) instead of ubuntu-latest
        required: false
        default: false
        type: boolean

jobs:
  build-and-push-container:
    name: Build and push container
    runs-on: ${{ inputs.use_arm_runner && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Get short SHA
      id: short-sha
      run: echo "short_sha=`git rev-parse --short HEAD`" >> $GITHUB_OUTPUT

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        aws-region: ${{ inputs.aws_region }}
        role-to-assume: ${{ inputs.aws_arn_role_to_assume }}
      if: inputs.container_registry == 'ecr'

    - name: Login to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
      if: inputs.container_registry == 'ecr'

    - name: Login to GitHub Container Registry
      id: login-ghcr
      uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      if: inputs.container_registry == 'ghcr'

    - name: Get registry/repo path
      id: get-registry-ecr
      run: echo "repository=${{ steps.ecr-login.outputs.registry }}/${{ inputs.image_name }}" >> $GITHUB_ENV
      if: inputs.container_registry == 'ecr'

    - name: Get registry/repo path
      id: get-registry-ghcr
      run: echo "repository=${{ inputs.image_repository }}/${{ inputs.image_name }}" >> $GITHUB_ENV
      if: inputs.container_registry == 'ghcr'

    - name: Create tag from tag from github.ref_name
      id: ref-name
      env:
        REF_NAME: ${{ github.ref_name }}
        SHORT_SHA: ${{ steps.short-sha.outputs.short_sha }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        echo "DEFAULT_TAG=${REF_NAME////-}_${SHORT_SHA}_${RUN_NUMBER}" >> "$GITHUB_ENV"

    - name: Build additional tag rules
      id: additional-tags
      run: |
        {
          echo "tags<<EOF"
          echo "${{ inputs.image_additional_tags }}" | tr ',' '\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$' | sed 's/^/type=raw,value=/'
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Extract metadata (tags, labels)
      id: extract-metadata
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.repository }}
        tags: |
          type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
          type=raw,enable=true,priority=200,prefix=,suffix=,value=${{ env.DEFAULT_TAG }}
          type=raw,value=latest,enable=true
          type=sha,enable=true,priority=100,prefix=sha-,suffix=,format=long
          ${{ steps.additional-tags.outputs.tags }}

    - run: ls -l

    - name: Determine container file
      id: container_file
      run: |
        if [ -n "${{ inputs.container_file }}" ]; then
          CONTAINER_FILE="${{ inputs.container_file }}"
        elif [ -f "Containerfile" ]; then
          CONTAINER_FILE="Containerfile"
        else
          CONTAINER_FILE="Dockerfile"
        fi
        echo "container_file=$CONTAINER_FILE" >> $GITHUB_OUTPUT

    - name: Build container and optionally push to registry
      id: container-build-push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        platforms: ${{ inputs.image_platforms }}
        file: ${{ steps.container_file.outputs.container_file }}
        context: ${{ inputs.container_build_context }}
        tags: ${{ steps.extract-metadata.outputs.tags }}
        labels: ${{ steps.extract-metadata.outputs.labels }}
        build-args: ${{ inputs.build_args }}
        cache-from: type=gha,scope=${{ inputs.image_name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}
        provenance: false
        push: ${{ inputs.container_push_to_registry }}

    - name: Run trivy repo vulnerability scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        # Use AWS ECR repo for the trivy-db image, as GitHub's Container
        # Registry (ghcr.io) is returning a TOOMANYREQUESTS error.
        # Ref: https://github.com/aquasecurity/trivy-action/issues/389
        TRIVY_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-db:2'
        TRIVY_JAVA_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-java-db:1'
      with:
        scan-type: 'fs'
        scan-ref: '.'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

    - name: Run trivy image vulnerability scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TAG: ${{ env.DEFAULT_TAG }}
        # Use AWS ECR repo for the trivy-db image, as GitHub's Container
        # Registry (ghcr.io) is returning a TOOMANYREQUESTS error.
        # Ref: https://github.com/aquasecurity/trivy-action/issues/389
        TRIVY_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-db:2'
        TRIVY_JAVA_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-java-db:1'
      with:
        image-ref: ${{ env.repository }}:${{ env.DEFAULT_TAG }}
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
      if: inputs.container_push_to_registry

    - name: Image digest
      run: echo "${{ steps.container-build-push.outputs.digest }}"
