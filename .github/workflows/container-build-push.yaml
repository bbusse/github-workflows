---
name: Build Container And Push To Registry

on:
  workflow_call:
    inputs:
      prefix:
        type: string
        description: A custom prefix
        required: false
      image_name:
        type: string
        description: A name for the resulting image
        required: true
      image_tag:
        type: string
        description: An optional image tag
        default: ''
      image_additional_tags:
        type: string
        description: A comma and/or newline separated list of additional tags to apply to the image
        required: false
        default: ''
      image_repository:
        type: string
        description: The image repository
        required: false
      aws_region:
        type: string
        required: false
        default: eu-central-1
      aws_arn_role_to_assume:
        type: string
        required: false
      image_platforms:
        type: string
        description: >-
          The target platforms to build for. More than one platform fans out
          over one native runner per platform and assembles a manifest list,
          rather than emulating the non-native ones under QEMU on a single
          runner.
        required: false
        default: linux/amd64,linux/arm64
      # We set a default in an action
      container_file:
        type: string
        description: The build recipe
        required: false
      container_build_context:
        type: string
        description: The path to the Containerfile
        required: false
        default: "."
      container_push_to_registry:
        type: boolean
        description: If to push to registry
        required: true
        default: true
      container_registry:
        type: string
        description: The container registry to push to, one of ghcr / ecr
        required: false
        default: 'ecr'
      build_args:
        type: string
        description: >-
          Newline-separated KEY=VALUE build arguments, for recipes that build
          more than one image out of one Containerfile.
        required: false
        default: ''
      use_arm_runner:
        description: >-
          Force the single-platform build onto an ARM runner. Ignored when
          image_platforms names more than one platform, where the runner is
          derived from each platform instead.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      multi: ${{ steps.platforms.outputs.multi }}
    steps:
      - name: Resolve platforms to runners
        id: platforms
        env:
          IMAGE_PLATFORMS: ${{ inputs.image_platforms }}
          USE_ARM_RUNNER: ${{ inputs.use_arm_runner }}
        run: |
          set -eu
          list="$(printf '%s' "$IMAGE_PLATFORMS" | tr -d '[:space:]' | tr ',' '\n' | grep -v '^$')"
          count="$(printf '%s\n' "$list" | wc -l | tr -d ' ')"

          entries=""
          while read -r p; do
            [ -n "$p" ] || continue
            case "$p" in
              */arm64|*/arm64/*) runner=ubuntu-24.04-arm ;;
              *)                 runner=ubuntu-latest ;;
            esac
            # A single platform keeps the old behaviour: the caller's
            # use_arm_runner decides, not the platform string.
            if [ "$count" -eq 1 ] && [ "$USE_ARM_RUNNER" = "true" ]; then
              runner=ubuntu-24.04-arm
            fi
            slug="$(printf '%s' "$p" | tr '/' '-')"
            entries="${entries}{\"platform\":\"${p}\",\"runner\":\"${runner}\",\"slug\":\"${slug}\"},"
          done <<EOF
          $list
          EOF

          echo "matrix={\"include\":[${entries%,}]}" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 1 ]; then
            echo "multi=true" >> "$GITHUB_OUTPUT"
          else
            echo "multi=false" >> "$GITHUB_OUTPUT"
          fi
          echo "resolved $count platform(s): ${entries%,}"

  scan-repo:
    name: Scan repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run trivy repo vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Use AWS ECR repo for the trivy-db image, as GitHub's Container
          # Registry (ghcr.io) is returning a TOOMANYREQUESTS error.
          # Ref: https://github.com/aquasecurity/trivy-action/issues/389
          TRIVY_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-db:2'
          TRIVY_JAVA_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-java-db:1'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  build-and-push-container:
    name: Build and push container (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only needed when this runner is not native to the platform it builds.
      - name: Set up QEMU
        if: ${{ !((endsWith(matrix.platform, '/arm64') && matrix.runner == 'ubuntu-24.04-arm') || (endsWith(matrix.platform, '/amd64') && matrix.runner == 'ubuntu-latest')) }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in and resolve image metadata
        id: meta
        uses: bbusse/github-workflows/.github/actions/registry-metadata@dev
        with:
          container_registry: ${{ inputs.container_registry }}
          image_name: ${{ inputs.image_name }}
          image_repository: ${{ inputs.image_repository }}
          image_tag: ${{ inputs.image_tag }}
          image_additional_tags: ${{ inputs.image_additional_tags }}
          aws_region: ${{ inputs.aws_region }}
          aws_arn_role_to_assume: ${{ inputs.aws_arn_role_to_assume }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine container file
        id: container_file
        env:
          CONTAINER_FILE_INPUT: ${{ inputs.container_file }}
        run: |
          set -eu
          if [ -n "$CONTAINER_FILE_INPUT" ]; then
            container_file="$CONTAINER_FILE_INPUT"
          elif [ -f "Containerfile" ]; then
            container_file="Containerfile"
          else
            container_file="Dockerfile"
          fi
          echo "container_file=${container_file}" >> "$GITHUB_OUTPUT"

      # Single platform, or not pushing at all: tag directly, exactly as
      # before. There is no manifest list to assemble.
      - name: Build container and optionally push to registry
        id: container-build-push
        if: ${{ needs.prepare.outputs.multi != 'true' || !inputs.container_push_to_registry }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: ${{ matrix.platform }}
          file: ${{ steps.container_file.outputs.container_file }}
          context: ${{ inputs.container_build_context }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=${{ inputs.image_name }}-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}-${{ matrix.slug }}
          provenance: false
          push: ${{ inputs.container_push_to_registry }}

      # Several platforms: push an untagged, digest-addressed image per
      # platform. The merge job below ties them together under the real tags.
      - name: Build container and push by digest
        id: container-build-digest
        if: ${{ needs.prepare.outputs.multi == 'true' && inputs.container_push_to_registry }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: ${{ matrix.platform }}
          file: ${{ steps.container_file.outputs.container_file }}
          context: ${{ inputs.container_build_context }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=${{ inputs.image_name }}-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}-${{ matrix.slug }}
          provenance: false
          outputs: type=image,name=${{ steps.meta.outputs.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: ${{ needs.prepare.outputs.multi == 'true' && inputs.container_push_to_registry }}
        env:
          DIGEST: ${{ steps.container-build-digest.outputs.digest }}
        run: |
          set -eu
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: ${{ needs.prepare.outputs.multi == 'true' && inputs.container_push_to_registry }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ inputs.image_name }}-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Run trivy image vulnerability scan
        if: ${{ needs.prepare.outputs.multi != 'true' && inputs.container_push_to_registry }}
        uses: bbusse/github-workflows/.github/actions/trivy-image-scan@dev
        with:
          image_ref: ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.default_tag }}

      - name: Image digest
        run: echo "${{ steps.container-build-push.outputs.digest || steps.container-build-digest.outputs.digest }}"

  merge:
    name: Assemble manifest list
    needs: [prepare, build-and-push-container]
    if: ${{ needs.prepare.outputs.multi == 'true' && inputs.container_push_to_registry }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ inputs.image_name }}-*
          merge-multiple: true

      - name: Log in and resolve image metadata
        id: meta
        uses: bbusse/github-workflows/.github/actions/registry-metadata@dev
        with:
          container_registry: ${{ inputs.container_registry }}
          image_name: ${{ inputs.image_name }}
          image_repository: ${{ inputs.image_repository }}
          image_tag: ${{ inputs.image_tag }}
          image_additional_tags: ${{ inputs.image_additional_tags }}
          aws_region: ${{ inputs.aws_region }}
          aws_arn_role_to_assume: ${{ inputs.aws_arn_role_to_assume }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          REPOSITORY: ${{ steps.meta.outputs.repository }}
        run: |
          set -eu
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REPOSITORY}@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE_REF: ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.default_tag }}
        run: docker buildx imagetools inspect "$IMAGE_REF"

      - name: Run trivy image vulnerability scan
        uses: bbusse/github-workflows/.github/actions/trivy-image-scan@dev
        with:
          image_ref: ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.default_tag }}
