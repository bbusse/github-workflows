---
name: Create Disk Image

on:
  workflow_call:
    inputs:
      target:
        description: Target to create (e.g., gentoo)
        required: true
        type: string
      arch:
        description: Target architecture (e.g., amd64, arm64)
        required: false
        default: amd64
        type: string
      use_arm_runner:
        description: Use ARM runner (ubuntu-24.04-arm) instead of ubuntu-latest
        required: false
        default: false
        type: boolean
      verify_fs:
        description: Fail the build if a filesystem consistency check fails
        required: false
        default: true
        type: boolean
      verify_fs_stages:
        description: Run filesystem checks between sub-steps of the rootfs build to localise corruption
        required: false
        default: false
        type: boolean
      font_urls:
        description: >-
          Space separated URLs of fonts to install into the image. Empty
          installs none; a font that cannot be fetched is skipped rather
          than failing the build.
        required: false
        default: ''
        type: string
      wait_for_job:
        description: Regexp for job to wait for
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  create-image:
    name: Create image (${{ inputs.arch }})
    runs-on: ${{ inputs.use_arm_runner && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Wait for job
        if: ${{ github.event_name != 'workflow_dispatch' && inputs.wait_for_job != '' }}
        uses: bbusse/github-workflows/.github/actions/wait-for-checks@dev
        with:
          check_regexp: ${{ inputs.wait_for_job }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target input
        id: resolve
        shell: bash
        env:
          TARGET_INPUT: ${{ inputs.target }}
          TARGET_DISPATCH: ${{ github.event.inputs.target }}
        run: |
          TARGET="$TARGET_INPUT"
          if [ -z "$TARGET" ]; then
            TARGET="$TARGET_DISPATCH"
          fi
          if [ -z "$TARGET" ]; then
            echo "Error: 'target' input is required but not provided." >&2
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Aggressive cleanup
        uses: bbusse/github-workflows/.github/actions/aggressive-cleanup@dev

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout image-builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpsBoost/image-builder
          ref: dev
          path: image-builder

      # The stage4 that image-builder would otherwise fetch comes from the
      # "latest" release tag, which a separate workflow publishes. Fetching
      # it here races that upload: a disk image job starting before the
      # upload completes silently builds from the *previous* stage4, with no
      # error anywhere. Stage the artifact from this commit's own stage4 run
      # instead; image-builder prefers a locally staged tarball over the
      # release. Best effort - if no matching run is found we fall back to
      # the release rather than failing the build.
      - name: Stage stage4 from this commit's build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.resolve.outputs.target }}
          ARCH: ${{ inputs.arch }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          flavour="${TARGET#gentoo-}"
          artifact="gentoo-stage4-${flavour}-${ARCH}"
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
                      --workflow "Build Gentoo Stage4" \
                      --commit "$SHA" --status success \
                      --json databaseId --jq '.[0].databaseId' || true)"
          if [ -z "${run_id:-}" ] || [ "${run_id}" = "null" ]; then
              echo "No successful stage4 run for ${SHA}, using the release"
              exit 0
          fi
          if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                 --name "$artifact" --dir .; then
              echo "Staged ${artifact} from run ${run_id}"
              ls -la ./*.tar.xz || true
          else
              echo "Artifact ${artifact} not in run ${run_id}, using the release"
          fi

      - name: Build
        env:
          VERIFY_FS: ${{ inputs.verify_fs && '1' || '0' }}
          VERIFY_FS_STAGES: ${{ inputs.verify_fs_stages && '1' || '0' }}
          FONT_URLS: ${{ inputs.font_urls }}
          TARGET: ${{ steps.resolve.outputs.target }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -eu
          sudo ./image-builder/image-builder install
          image-builder create "$TARGET" "$ARCH"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disk-image-${{ steps.resolve.outputs.target }}-${{ inputs.arch }}
          path: ${{ steps.resolve.outputs.target }}-${{ inputs.arch }}.raw
