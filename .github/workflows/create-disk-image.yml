name: Create Disk Image

on:
  workflow_call:
    inputs:
      target:
        description: Target to create (e.g., gentoo)
        required: true
        type: string
      wait-for-job:
        description: Regexp for job to wait for
        required: true
        type: string

permissions:
  contents: read

jobs:
  create_image:
    name: Create image
    runs-on: ubuntu-latest
    steps:
      - name: Wait for job
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.ref }}
          check-regexp: ${{ inputs.wait-for-job }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
      - name: Resolve target input
        id: resolve
        shell: bash
        run: |
          TARGET="${{ inputs.target }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ github.event.inputs.target }}"
          fi
          if [ -z "$TARGET" ]; then
            echo "Error: 'target' input is required but not provided." >&2
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Aggressive cleanup
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift \
                      /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android \
                      /usr/local/share/chromium /opt/microsoft /opt/google \
                      /opt/az /usr/local/share/powershell /opt/hostedtoolcache || true
          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout image-builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpsBoost/image-builder
          ref: dev
          path: image-builder

      - name: Build
        run: |
          ls -al
          sudo ./image-builder/image-builder install
          image-builder create "${{ steps.resolve.outputs.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disk-image-${{ steps.resolve.outputs.target }}
          path: ${{ steps.resolve.outputs.target }}.raw
