name: FreeBSD Rust Package Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        description: Base name for the output archive
        required: true
        type: string
      binary_name:
        description: Rust binary name passed to cargo --bin
        required: true
        type: string
      working_directory:
        description: Directory containing Cargo.toml
        required: false
        default: .
        type: string

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD Rust Build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: FreeBSD Rust Build
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        id: build
        with:
          usesh: true
          prepare: |
            pkg install -y rust

          run: |
            freebsd-version
            pwd
            ls -lah
            cd "${{ inputs.working_directory }}"
            cargo build --release --locked --bin "${{ inputs.binary_name }}"
            cp "target/release/${{ inputs.binary_name }}" "${{ inputs.artifact_name }}"
            tar -cJvf "${{ inputs.artifact_name }}-freebsd-amd64.tar.xz" "${{ inputs.artifact_name }}"
            ls -lah

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-freebsd-amd64.tar.xz
          path: ${{ inputs.working_directory }}/${{ inputs.artifact_name }}-freebsd-amd64.tar.xz
