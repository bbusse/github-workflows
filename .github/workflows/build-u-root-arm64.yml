name: Build u-root arm64

on:
  workflow_call:
    inputs:
      arch:
        description: Target architecture (e.g., amd64)
        required: true
        type: string
      image_name:
        description: Base image name (default gentoo-stage4)
        required: false
        default: gentoo-stage4
        type: string
      registry:
        description: Container registry (e.g., ghcr.io/bbusse)
        required: true
        type: string
      tag:
        description: Image tag to push (default latest)
        required: false
        default: latest
        type: string
      use_arm_runner:
        description: Use ARM runner (ubuntu-24.04-arm) instead of ubuntu-latest
        required: false
        default: false
        type: boolean
    secrets:
      GHCR_TOKEN:
        description: Token for pushing to container registry
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build_stage4:
    name: Build u-root (${{ inputs.arch }})
    runs-on: ${{ inputs.use_arm_runner && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Aggressive cleanup
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift \
                      /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android \
                      /usr/local/share/chromium /opt/microsoft /opt/google \
                      /opt/az /usr/local/share/powershell /opt/hostedtoolcache || true
          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout image-builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpsBoost/image-builder
          ref: dev
          path: image-builder

      - name: Build
        env:
          IMAGE_LOCAL: ${{ inputs.image_name }}-${{ inputs.flavour }}-${{ inputs.arch }}
          IMAGE_REMOTE: ${{ inputs.registry }}/${{ inputs.image_name }}-${{ inputs.flavour }}-${{ inputs.arch }}:${{ inputs.tag }}
          REGISTRY: ${{ inputs.registry }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ls -al
          sudo ./image-builder/image-builder install
          image-builder build u-root ${{ inputs.arch }}
          echo "$GHCR_TOKEN" | podman login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          podman tag "$IMAGE_LOCAL" "$IMAGE_REMOTE"
          podman push "$IMAGE_REMOTE"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gentoo-stage4-${{ inputs.flavour }}-${{ inputs.arch }}
          path: gentoo-stage4-*
