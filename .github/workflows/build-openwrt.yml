---
name: Build OpenWrt

on:
  workflow_call:
    inputs:
      flavour:
        description: Target flavour/architecture (e.g., x86_64)
        required: false
        default: x86_64
        type: string
      artifact_name:
        description: Artifact name prefix to upload
        required: false
        default: openwrt
        type: string
      openwrt_branch:
        description: Branch of the OpenWrt source fork to build (e.g., dev, ap120c)
        required: false
        default: dev
        type: string

      use_arm_runner:
        description: Use ARM runner (ubuntu-24.04-arm) instead of ubuntu-latest
        required: false
        default: false
        type: boolean
    secrets:
      OPENWRT_APK_PRIVATE_KEY:
        description: >-
          PEM private key used to sign packages and the image's apk keyring.
          Optional; without it every build signs with a throwaway key and
          packages only install on the image from the same build.
        required: false
permissions:
  contents: read

jobs:
  build-openwrt:
    name: Build OpenWrt
    runs-on: ${{ inputs.use_arm_runner && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Aggressive cleanup
        uses: bbusse/github-workflows/.github/actions/aggressive-cleanup@dev

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout image-builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpsBoost/image-builder
          ref: dev
          path: image-builder

      - name: Build
        env:
          FLAVOUR: ${{ inputs.flavour }}
          OPENWRT_BRANCH: ${{ inputs.openwrt_branch }}
          OPENWRT_APK_PRIVATE_KEY: ${{ secrets.OPENWRT_APK_PRIVATE_KEY }}
        run: |
          set -eu
          sudo ./image-builder/image-builder install
          image-builder build openwrt "$FLAVOUR"
          ls -al

      # VM disk images (x86/64 and armsr/armv8): combined EFI/BIOS disks
      # and bare rootfs images, gzip-compressed, from bin/targets/<t>/<s>.
      - name: Upload disk image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ inputs.flavour }}
          path: openwrt/bin/targets/*/*/openwrt-*.img.gz
          if-no-files-found: ignore

      # Kernel modules (bin/targets/<target>/<sub>/packages, tied to this
      # build's kernel) and user-space packages (bin/packages/<arch>/<feed>),
      # for every flavour. Signed with the build's apk key, see the
      # OPENWRT_APK_PRIVATE_KEY secret.
      - name: Upload packages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ inputs.flavour }}-packages
          path: |
            openwrt/bin/targets/*/*/packages/*
            openwrt/bin/packages/*/*/*

      # Embedded targets (e.g. ath79 for the ALFA AP120C) put their
      # sysupgrade/factory/initramfs images under bin/targets/<target>/<sub>.
      - name: Upload firmware images artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ inputs.flavour }}-firmware
          path: |
            openwrt/bin/targets/*/*/openwrt-*.bin
            openwrt/bin/targets/*/*/openwrt-*.manifest
            openwrt/bin/targets/*/*/sha256sums
            openwrt/bin/targets/*/*/config.buildinfo
          if-no-files-found: ignore
