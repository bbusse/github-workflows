---
name: Linux Go Package Build

on:
  workflow_call:
    inputs:
      repository:
        description: Repository to check out and build from (defaults to the calling repository)
        required: false
        default: ''
        type: string
      ref:
        description: Git ref (branch, tag, or SHA) to check out; defaults to the repository's default branch
        required: false
        default: ''
        type: string
      binary_name:
        description: Go binary filename to build (defaults to artifact_name)
        required: false
        type: string
        default: ''
      artifact_name:
        required: true
        type: string
      working_directory:
        description: Directory (relative to the checked-out repository) containing the Go package to build
        required: false
        default: .
        type: string
      go_version:
        description: Go toolchain version
        required: false
        default: 'stable'
        type: string
      architectures:
        description: GOARCH values to build, as a JSON list
        required: false
        default: '["amd64", "arm64"]'
        type: string
      gomips:
        description: GOMIPS for mips and mipsle builds, e.g. softfloat for CPUs without an FPU; empty keeps Go's default
        required: false
        default: ''
        type: string
      trimpath:
        description: Build with -trimpath
        required: false
        default: false
        type: boolean
      ldflags:
        description: Value for go build -ldflags, e.g. -s -w to strip the binary
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
    env:
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
      GOMIPS: ${{ inputs.gomips }}
      CGO_ENABLED: 0
      ARTIFACT_SUFFIX: linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - uses: bbusse/github-workflows/.github/actions/setup-go@dev
        with:
          version: ${{ inputs.go_version }}

      - name: Build
        working-directory: ${{ inputs.working_directory }}
        env:
          BINARY_NAME: ${{ inputs.binary_name }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          TRIMPATH: ${{ inputs.trimpath }}
          LDFLAGS: ${{ inputs.ldflags }}
        run: |
          set -euo pipefail
          bin="${BINARY_NAME:-$ARTIFACT_NAME}"
          flags=()
          [ "$TRIMPATH" != true ] || flags+=(-trimpath)
          [ -z "$LDFLAGS" ] || flags+=(-ldflags "$LDFLAGS")
          go build "${flags[@]}" -o "$bin" .
          tar -cJf "${ARTIFACT_NAME}-${ARTIFACT_SUFFIX}.tar.xz" "$bin"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-linux-${{ matrix.arch }}.tar.xz
          path: ${{ inputs.working_directory }}/${{ inputs.artifact_name }}-linux-${{ matrix.arch }}.tar.xz
