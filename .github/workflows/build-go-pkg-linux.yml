name: Linux Go Package Build

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    name: Linux Build
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          sudo apt install golang-go
          pwd
          ls -lah
          go build -o ${{ inputs.artifact_name }}
          tar -cJvf ${{ inputs.artifact_name }}-linux-amd64-latest.tar.xz ${{ inputs.artifact_name }}
          ls -lah

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-linux-amd64-latest.tar.xz
          path: ${{ inputs.artifact_name }}-linux-amd64-latest.tar.xz
