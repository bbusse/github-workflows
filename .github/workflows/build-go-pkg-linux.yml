name: Linux Go Package Build

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string

jobs:
  build-linux:
    runs-on: ubuntu-latest
    name: Linux Build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          sudo apt install golang-go
          pwd
          ls -lah
          go build -o ${{ inputs.artifact_name }}
          tar -cJvf ${{ inputs.artifact_name }}-linux-amd64.tar.xz ${{ inputs.artifact_name }}
          ls -lah

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-linux-amd64.tar.xz
          path: ${{ inputs.artifact_name }}-linux-amd64.tar.xz
