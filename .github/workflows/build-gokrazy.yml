---
name: Build Gokrazy Disk Image
on:

  workflow_call:
    inputs:
      image_name:
        description: "Name of the disk image file to upload."
        required: false
        default: "gokrazy-virtual.img"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gokrazy repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gokrazy/gokrazy
          path: gokrazy

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Ensure all files were formatted as per gofmt
        working-directory: gokrazy
        run: |
          set -eu
          unformatted="$(find . -name '*.go' -exec gofmt -l {} +)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean:"
            printf '  %s\n' "$unformatted"
            exit 1
          fi

      - name: install gok CLI
        run: |
          cd gokrazy
          GOPROXY=direct go install github.com/gokrazy/tools/cmd/gok@main

      - name: install qemu
        run: sudo apt update && sudo apt-get install qemu-system-x86

      - name: run tests
        run: |
          cd gokrazy
          go test -v ./...

      - name: generate gokrazy disk image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -eu
          cd gokrazy
          GOPATH="$(go env GOPATH)"
          export PATH="${PATH}:${GOPATH}/bin"
          gok new
          GOARCH=amd64 gok -i virtual overwrite --full "$IMAGE_NAME" --target_storage_bytes 4294967296

      - name: Upload disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gokrazy-disk-image
          path: gokrazy/${{ inputs.image_name }}
