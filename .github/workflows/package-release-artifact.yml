---
name: Package release artifact

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact uploaded earlier in the calling workflow run that holds the file
        required: true
        type: string
      file:
        description: File inside that artifact to package
        required: true
        type: string
      name:
        description: >-
          Name to package it under. The file is xz-compressed into it and a
          <name>.sha384 is written next to it.
        required: true
        type: string
      release_artifact:
        description: >-
          Artifact to upload the two files as. Name it <prefix>-<something>
          for release.yml's artifact_name: <prefix> to pick it up.
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ inputs.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: in

      # release.yml neither compresses nor checksums, and release assets are
      # capped at 2 GiB, which a raw disk image easily exceeds
      - name: Compress and checksum
        env:
          FILE: ${{ inputs.file }}
          NAME: ${{ inputs.name }}
        run: |
          set -eu
          mkdir -p dist
          xz -T0 -c "in/$FILE" >"dist/$NAME"
          (cd dist && sha384sum "$NAME" >"$NAME.sha384")
          ls -la dist

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.release_artifact }}
          path: dist/
          if-no-files-found: error
