name: Build Gentoo Package

# Checks out a real Portage overlay repo (e.g. bbusse/bbusse-overlay) inside an official
# gentoo/stage3 container, generates the Manifest fresh (crate hashes aren't committed to the
# overlay), then emerges it to confirm it actually configures, compiles and installs. The
# ebuild is self-sufficient - it fetches the actual package's own source itself (e.g. via
# git-r3/EGIT_REPO_URI), same as it would for anyone running a plain `emerge` against this
# overlay outside of this CI job.
#
# emerge resolves and builds the full dependency tree normally, source included where no
# binary happens to be available - same as a real `emerge x11-misc/vju` on an actual Gentoo
# install. No --usepkgonly/binhost forcing: that's not a shortcut worth fighting Portage's
# source-based model for, it just adds complexity for a CI job.
#
# Leave `version` unset for a plain build-check (every push): the overlay's own checked-in
# ebuild filename version is used as-is, nothing is uploaded. Set `version` (e.g. from
# compute-version.yml's output) for a release build: the ebuild is renamed to that version
# before building, and the resulting .gpkg.tar binary package is uploaded as
# <artifact_name>-gentoo-amd64.
#
# amd64 only - no arm64 job, matching gentoo/stage3's default image.

on:
  workflow_call:
    inputs:
      overlay_repo:
        description: Overlay repository holding the ebuild, e.g. bbusse/bbusse-overlay
        required: true
        type: string
      overlay_ref:
        description: Branch/ref of overlay_repo to check out
        required: false
        default: main
        type: string
      ebuild_path:
        description: Path (relative to overlay_repo's root) to the checked-in .ebuild file, e.g. x11-misc/vju/vju-0.1.0.ebuild. Category and package name are derived from this path's directory structure.
        required: true
        type: string
      version:
        description: Real version to build under (e.g. v1-rc0, from compute-version.yml). Normalised into a Gentoo PV (v stripped, - to _). Leave unset for a plain build-check using the checked-in ebuild's own filename version - nothing is uploaded in that case.
        required: false
        default: ''
        type: string
      artifact_name:
        description: Artifact name prefix the built .gpkg.tar is uploaded under (only used when version is set)
        required: false
        default: ''
        type: string
      accept_keywords:
        description: ACCEPT_KEYWORDS passed to emerge (matches the ebuild's own KEYWORDS, e.g. ~amd64)
        required: false
        default: '~amd64'
        type: string
      stage3_image:
        description: Gentoo stage3 container image to build inside
        required: false
        default: docker.io/gentoo/stage3:latest
        type: string
      disable:
        description: Skip the job entirely without removing it from the caller - a full from-source Gentoo build can take hours (e.g. compiling mesa), so this is here to turn it off on a per-caller basis without deleting the job block.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: ${{ !inputs.disable }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.stage3_image }}
    env:
      ACCEPT_KEYWORDS: ${{ inputs.accept_keywords }}
      # Personal overlay ships no licenses/ dir of its own, so unknown
      # per-dependency license identifiers (e.g. a crate using a license
      # string not yet in ::gentoo's list) shouldn't block a build check.
      ACCEPT_LICENSE: '*'
    steps:
      - name: Checkout overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.overlay_repo }}
          ref: ${{ inputs.overlay_ref }}
          path: ./overlay-src

      - name: Refresh Portage tree
        run: emerge-webrsync

      - name: Configure binpkg format
        run: echo 'BINPKG_FORMAT="gpkg"' >> /etc/portage/make.conf

      - name: Register overlay
        run: |
          OVERLAY_NAME="$(cat ./overlay-src/profiles/repo_name)"
          PKG_DIR_REL="$(dirname "${{ inputs.ebuild_path }}")"
          CATEGORY="$(dirname "$PKG_DIR_REL")"
          PKG_NAME="$(basename "$PKG_DIR_REL")"
          echo "OVERLAY_NAME=$OVERLAY_NAME" >> "$GITHUB_ENV"
          echo "CATEGORY=$CATEGORY"         >> "$GITHUB_ENV"
          echo "PKG_NAME=$PKG_NAME"         >> "$GITHUB_ENV"

          mkdir -p "/var/db/repos/${OVERLAY_NAME}"
          cp -a ./overlay-src/. "/var/db/repos/${OVERLAY_NAME}/"

          PKG_DIR="/var/db/repos/${OVERLAY_NAME}/${PKG_DIR_REL}"
          if [[ -n "${{ inputs.version }}" ]]; then
            PKG_VERSION="$(echo "${{ inputs.version }}" | awk '{ sub(/^[vV]/, ""); gsub(/-/, "_"); print }')"
            mv "/var/db/repos/${OVERLAY_NAME}/${{ inputs.ebuild_path }}" "${PKG_DIR}/${PKG_NAME}-${PKG_VERSION}.ebuild"
          else
            RAW_NAME="$(basename "${{ inputs.ebuild_path }}" .ebuild)"
            PKG_VERSION="${RAW_NAME#${PKG_NAME}-}"
          fi
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

          mkdir -p /etc/portage/repos.conf
          {
            echo "[${OVERLAY_NAME}]"
            echo "location = /var/db/repos/${OVERLAY_NAME}"
            echo "masters = gentoo"
            echo "auto-sync = no"
          } > "/etc/portage/repos.conf/${OVERLAY_NAME}.conf"

      - name: Generate Manifest
        working-directory: /var/db/repos/${{ env.OVERLAY_NAME }}/${{ env.CATEGORY }}/${{ env.PKG_NAME }}
        run: ebuild ./*.ebuild manifest

      - name: Build
        run: emerge --buildpkg=y --autounmask=y --autounmask-write=y --autounmask-continue=y --verbose "${CATEGORY}/${PKG_NAME}"

      - name: Stage package
        if: ${{ inputs.version != '' }}
        run: |
          mkdir -p ./out
          pkg="$(find "/var/cache/binpkgs/${CATEGORY}/${PKG_NAME}" -name '*.gpkg.tar' | head -n1)"
          [ -n "$pkg" ] || { echo "::error::No .gpkg.tar produced under /var/cache/binpkgs/${CATEGORY}/${PKG_NAME}" >&2; exit 1; }
          cp "$pkg" "./out/${PKG_NAME}-${PKG_VERSION}.amd64.gpkg.tar"
          ls -lah ./out

      - name: Upload package artifact
        if: ${{ inputs.version != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name || github.event.repository.name }}-gentoo-amd64
          path: ./out/*.gpkg.tar
