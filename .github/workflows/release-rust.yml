name: Rust Binary Release

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Uploaded artifact name prefix to download
        required: true
        type: string
      binary_name:
        description: Binary filename inside the artifact
        required: true
        type: string
      release_tag:
        description: Git tag name to publish/update
        required: false
        default: latest
        type: string
      release_name:
        description: Human-readable release title
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_name }}-*
          merge-multiple: true
          path: ./release

      - name: Show release artifacts
        run: ls -lah ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name || inputs.release_tag }}
          files: ./release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
