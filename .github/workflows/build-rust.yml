---
name: Rust Build

on:
  workflow_call:
    inputs:
      binary_name:
        description: Rust binary name to build
        required: true
        type: string
      artifact_name:
        description: Artifact name prefix to upload
        required: true
        type: string
      working_directory:
        description: Directory where Cargo.toml is located
        required: false
        default: .
        type: string
      rust_toolchain:
        description: Rust toolchain channel/version
        required: false
        # Pinned rather than "stable": a stable-channel release has broken
        # `cargo install cargo-zigbuild` before with reproducible SIGSEGVs in
        # proc-macro2/quote/serde_core/rustix build scripts (a rustc codegen
        # regression, not anything in this repo). Bump deliberately, not by
        # just tracking whatever's currently "stable".
        default: '1.97.1'
        type: string
      musl:
        description: Also build musl libc targets (linux-amd64-musl, linux-arm64-musl)
        required: false
        default: false
        type: boolean
      dmg:
        description: Also package the macOS build into a .dmg (requires an <binary_name>.app bundle template checked into the repo, unless app_bundle_path is set)
        required: false
        default: false
        type: boolean
      app_bundle_path:
        description: Path (relative to working_directory) to the .app bundle template to package into the dmg; defaults to "<binary_name>.app"
        required: false
        default: ''
        type: string
      armv7:
        description: Also build the armv7 (32-bit ARM, armv7-unknown-linux-gnueabihf) target
        required: false
        default: false
        type: boolean
      alpine_image:
        description: Alpine image used to build the musl targets natively
        required: false
        default: docker.io/library/alpine:3.24.1
        type: string

permissions:
  contents: read

jobs:
  # One shape for every rustup-buildable target: install the toolchain, build,
  # stage under dist/. Targets needing a cross compiler carry the apt packages
  # and the compiler binary in the matrix; the env var names cargo looks for
  # are derived from the triple rather than spelled out per target.
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: macos-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
          - suffix: linux-amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - suffix: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross_packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            cross_cc: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cross toolchain
        if: ${{ matrix.cross_packages != '' }}
        env:
          CROSS_PACKAGES: ${{ matrix.cross_packages }}
          CROSS_CC: ${{ matrix.cross_cc }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          sudo apt-get update
          # shellcheck disable=SC2086 # deliberately word-split into packages
          sudo apt-get install -y --no-install-recommends $CROSS_PACKAGES
          # cargo and the cc crate each look for a differently-shaped env var
          # named after the target triple; derive both from the triple itself
          # so a new cross target only has to name its compiler above.
          {
            echo "CC_$(printf '%s' "$TARGET" | tr '-' '_')=${CROSS_CC}"
            echo "CARGO_TARGET_$(printf '%s' "$TARGET" | tr 'a-z-' 'A-Z_')_LINKER=${CROSS_CC}"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        uses: bbusse/github-workflows/.github/actions/rust-build@dev
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          target: ${{ matrix.target }}
          binary_name: ${{ inputs.binary_name }}
          artifact_suffix: ${{ matrix.suffix }}
          working_directory: ${{ inputs.working_directory }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.suffix }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.binary_name }}-${{ matrix.suffix }}

  # Same shape as a `build` matrix entry, but opt-in: a job-level `if` can't
  # see the matrix context, so an optional target can't just be another entry
  # above without spawning a no-op runner when it is switched off.
  build-linux-armv7:
    name: Build linux-armv7
    if: ${{ inputs.armv7 }}
    runs-on: ubuntu-latest
    env:
      TARGET: armv7-unknown-linux-gnueabihf
      ARTIFACT_SUFFIX: linux-armv7
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cross toolchain
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross

      - name: Build release binary
        uses: bbusse/github-workflows/.github/actions/rust-build@dev
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          target: ${{ env.TARGET }}
          binary_name: ${{ inputs.binary_name }}
          artifact_suffix: ${{ env.ARTIFACT_SUFFIX }}
          working_directory: ${{ inputs.working_directory }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}

  # rustup's prebuilt musl targets are missing a PIE-capable C runtime object,
  # so a rustup-installed toolchain can only link musl targets as plain static
  # (no dynamic section at all - dlopen(), e.g. winit's wayland backend loading
  # libwayland-client.so at runtime, can't work). Alpine's own native
  # rust/cargo packages don't have this gap - their musl toolchain produces
  # ET_DYN/PIE by default, no special flags needed - so build natively inside
  # an Alpine container instead of cross-compiling with rustup. build-apk.yml's
  # build-apk-arm64-from-source job already builds this way reliably.
  #
  # No --target: the container already runs natively for its own host arch, and
  # passing --target explicitly - even when it names the same triple the
  # container is already running as - makes cargo look up that triple as a
  # separate, explicitly-installed target. Alpine's arm64 rust apk doesn't
  # register one that way, so build ambient/implicit on both, which also keeps
  # the output path the same (target/release, not target/<TRIPLE>/release).
  build-musl:
    name: Build ${{ matrix.suffix }}
    if: ${{ inputs.musl }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: linux-amd64-musl
            runner: ubuntu-latest
          - suffix: linux-arm64-musl
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release binary
        env:
          ALPINE_IMAGE: ${{ inputs.alpine_image }}
          BINARY_NAME: ${{ inputs.binary_name }}
          WORKDIR: ${{ inputs.working_directory }}
        run: |
          set -eu
          podman run --rm \
            -v "$PWD:/work" \
            -w "/work/${WORKDIR}" \
            "$ALPINE_IMAGE" \
            sh -c "apk add --no-cache rust cargo && cargo build --release --locked --bin ${BINARY_NAME}"

      - name: Stage artifact
        working-directory: ${{ inputs.working_directory }}
        env:
          BINARY_NAME: ${{ inputs.binary_name }}
          ARTIFACT_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -eu
          mkdir -p dist
          cp "target/release/${BINARY_NAME}" "dist/${BINARY_NAME}-${ARTIFACT_SUFFIX}"
          chmod +x "dist/${BINARY_NAME}-${ARTIFACT_SUFFIX}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.suffix }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.binary_name }}-${{ matrix.suffix }}

  build-macos-dmg:
    name: Build macOS DMG
    if: ${{ inputs.dmg }}
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download macOS build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}-macos-arm64
          path: ./dist

      - name: Assemble app bundle and create dmg
        working-directory: ${{ inputs.working_directory }}
        env:
          APP_BUNDLE_PATH: ${{ inputs.app_bundle_path }}
          BINARY_NAME: ${{ inputs.binary_name }}
        run: |
          set -eu
          app_bundle="${APP_BUNDLE_PATH:-}"
          [ -n "$app_bundle" ] || app_bundle="${BINARY_NAME}.app"
          stage_dir="$(mktemp -d)"
          stage="${stage_dir}/${BINARY_NAME}.app"
          cp -R "$app_bundle" "$stage"
          cp "dist/${BINARY_NAME}-macos-arm64" "$stage/Contents/MacOS/${BINARY_NAME}"
          chmod +x "$stage/Contents/MacOS/${BINARY_NAME}"
          hdiutil create -volname "$BINARY_NAME" -srcfolder "$stage" -ov -format UDZO "${BINARY_NAME}.dmg"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-macos-arm64.dmg
          path: ${{ inputs.working_directory }}/${{ inputs.binary_name }}.dmg
          archive: false
