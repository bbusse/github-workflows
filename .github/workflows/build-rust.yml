name: Rust Build

on:
  workflow_call:
    inputs:
      binary_name:
        description: Rust binary name to build
        required: true
        type: string
      artifact_name:
        description: Artifact name prefix to upload
        required: true
        type: string
      working_directory:
        description: Directory where Cargo.toml is located
        required: false
        default: .
        type: string
      rust_toolchain:
        description: Rust toolchain channel/version
        required: false
        default: stable
        type: string

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
      ARTIFACT_SUFFIX: macos-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ env.TARGET }}

      - name: Build release binary
        working-directory: ${{ inputs.working_directory }}
        run: cargo build --release --locked --target "${{ env.TARGET }}" --bin "${{ inputs.binary_name }}"

      - name: Stage artifact
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/${{ inputs.binary_name }}" "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"
          chmod +x "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}

  build-linux-amd64:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
      ARTIFACT_SUFFIX: linux-amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ env.TARGET }}

      - name: Build release binary
        working-directory: ${{ inputs.working_directory }}
        run: cargo build --release --locked --target "${{ env.TARGET }}" --bin "${{ inputs.binary_name }}"

      - name: Stage artifact
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/${{ inputs.binary_name }}" "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"
          chmod +x "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}

  build-linux-arm64:
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-gnu
      ARTIFACT_SUFFIX: linux-arm64
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ env.TARGET }}

      - name: Build release binary
        working-directory: ${{ inputs.working_directory }}
        run: cargo build --release --locked --target "${{ env.TARGET }}" --bin "${{ inputs.binary_name }}"

      - name: Stage artifact
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/${{ inputs.binary_name }}" "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"
          chmod +x "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}
