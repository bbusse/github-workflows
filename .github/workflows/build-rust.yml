name: Rust Build

on:
  workflow_call:
    inputs:
      binary_name:
        description: Rust binary name to build
        required: true
        type: string
      artifact_name:
        description: Artifact name prefix to upload
        required: true
        type: string
      working_directory:
        description: Directory where Cargo.toml is located
        required: false
        default: .
        type: string
      rust_toolchain:
        description: Rust toolchain channel/version
        required: false
        default: stable
        type: string
      musl:
        description: Also build musl libc targets (linux-amd64-musl, linux-arm64-musl)
        required: false
        default: false
        type: boolean
      dmg:
        description: Also package the macOS build into a .dmg (requires an <binary_name>.app bundle template checked into the repo, unless app_bundle_path is set)
        required: false
        default: false
        type: boolean
      app_bundle_path:
        description: Path (relative to working_directory) to the .app bundle template to package into the dmg; defaults to "<binary_name>.app"
        required: false
        default: ''
        type: string
      armv7:
        description: Also build the armv7 (32-bit ARM, armv7-unknown-linux-gnueabihf) target
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
      ARTIFACT_SUFFIX: macos-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of pin date; bump periodically for new Rust releases
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ env.TARGET }}

      - name: Build release binary
        working-directory: ${{ inputs.working_directory }}
        run: cargo build --release --locked --target "${{ env.TARGET }}" --bin "${{ inputs.binary_name }}"

      - name: Stage artifact
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/${{ inputs.binary_name }}" "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"
          chmod +x "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}

  build-macos-dmg:
    if: ${{ inputs.dmg }}
    needs:
      - build-macos-arm64
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download macOS build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}-macos-arm64
          path: ./dist

      - name: Assemble app bundle and create dmg
        working-directory: ${{ inputs.working_directory }}
        run: |
          APP_BUNDLE="${{ inputs.app_bundle_path }}"
          [ -n "$APP_BUNDLE" ] || APP_BUNDLE="${{ inputs.binary_name }}.app"
          STAGE_DIR="$(mktemp -d)"
          STAGE="${STAGE_DIR}/${{ inputs.binary_name }}.app"
          cp -R "$APP_BUNDLE" "$STAGE"
          cp "dist/${{ inputs.binary_name }}-macos-arm64" "$STAGE/Contents/MacOS/${{ inputs.binary_name }}"
          chmod +x "$STAGE/Contents/MacOS/${{ inputs.binary_name }}"
          hdiutil create -volname "${{ inputs.binary_name }}" -srcfolder "$STAGE" -ov -format UDZO "${{ inputs.binary_name }}.dmg"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-macos-arm64.dmg
          path: ${{ inputs.working_directory }}/${{ inputs.binary_name }}.dmg
          archive: false

  build-linux-amd64:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
      ARTIFACT_SUFFIX: linux-amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of pin date; bump periodically for new Rust releases
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ env.TARGET }}

      - name: Build release binary
        working-directory: ${{ inputs.working_directory }}
        run: cargo build --release --locked --target "${{ env.TARGET }}" --bin "${{ inputs.binary_name }}"

      - name: Stage artifact
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/${{ inputs.binary_name }}" "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"
          chmod +x "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}

  build-linux-arm64:
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-gnu
      ARTIFACT_SUFFIX: linux-arm64
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of pin date; bump periodically for new Rust releases
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ env.TARGET }}

      - name: Build release binary
        working-directory: ${{ inputs.working_directory }}
        run: cargo build --release --locked --target "${{ env.TARGET }}" --bin "${{ inputs.binary_name }}"

      - name: Stage artifact
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/${{ inputs.binary_name }}" "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"
          chmod +x "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}

  build-linux-armv7:
    if: ${{ inputs.armv7 }}
    runs-on: ubuntu-latest
    env:
      TARGET: armv7-unknown-linux-gnueabihf
      ARTIFACT_SUFFIX: linux-armv7
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of pin date; bump periodically for new Rust releases
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ env.TARGET }}

      - name: Build release binary
        working-directory: ${{ inputs.working_directory }}
        run: cargo build --release --locked --target "${{ env.TARGET }}" --bin "${{ inputs.binary_name }}"

      - name: Stage artifact
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/${{ inputs.binary_name }}" "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"
          chmod +x "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}

  build-linux-amd64-musl:
    if: ${{ inputs.musl }}
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      ARTIFACT_SUFFIX: linux-amd64-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of pin date; bump periodically for new Rust releases
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ env.TARGET }}

      - name: Build release binary
        working-directory: ${{ inputs.working_directory }}
        run: cargo build --release --locked --target "${{ env.TARGET }}" --bin "${{ inputs.binary_name }}"

      - name: Stage artifact
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/${{ inputs.binary_name }}" "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"
          chmod +x "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}

  build-linux-arm64-musl:
    if: ${{ inputs.musl }}
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-musl
      ARTIFACT_SUFFIX: linux-arm64-musl
      ZIG_VERSION: "0.16.0"
      ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        run: |
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p /opt/zig
          tar -xJf zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          rm zig.tar.xz

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of pin date; bump periodically for new Rust releases
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ env.TARGET }}

      - name: Build release binary
        working-directory: ${{ inputs.working_directory }}
        run: cargo zigbuild --release --locked --target "${{ env.TARGET }}" --bin "${{ inputs.binary_name }}"

      - name: Stage artifact
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/${{ inputs.binary_name }}" "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"
          chmod +x "dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}
