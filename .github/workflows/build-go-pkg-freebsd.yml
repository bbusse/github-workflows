name: FreeBSD Package Build

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD Build
    steps:
      - uses: actions/checkout@v6
      - name: FreeBSD Build
        uses: vmactions/freebsd-vm@v1.3.0
        id: build
        with:
          usesh: true
          prepare: |
            pkg install -y curl go

          run: |
            freebsd-version
            pwd
            ls -lah
            go build -o ${{ inputs.artifact_name }}
            tar -cJvf ${{ inputs.artifact_name }}-freebsd-amd64-latest.tar.xz ${{ inputs.artifact_name }}
            ls -lah

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-freebsd-amd64-latest.tar.xz
          path: ${{ inputs.artifact_name }}-freebsd-amd64-latest.tar.xz
