name: Binary Release

# VERSION file tracks the current release state:
#   v0         initial / last clean release
#   v1-rc0     release candidate series in progress
#
# Tag conventions:
#   rc-*       release candidate
#              v0      → v1-rc0   (start new rc series)
#              v1-rcN  → v1-rc(N+1)
#   release-*  full release
#              v1-rcN  → v1       (finalise; strip rc)
#              v0      → v1       (direct release without prior rc)
#
# Both paths commit the updated VERSION back to release_branch.
#
# Set version_branch to also commit the bumped VERSION file to a second
# branch (e.g. release_branch: ci, version_branch: dev, when tags must be
# cut from a branch that carries the workflow files but VERSION should stay
# visible on the actual development branch too). This is an independent
# single-file commit on that branch's own tip - not a merge of
# release_branch's tree - so it won't drag along anything else that only
# lives on release_branch.
#
# Set always_release: true to skip the VERSION/tag scheme entirely and
# instead release on every run, tagged the same way container-build-push
# tags images: <branch>_<short-sha>_<run-number>, plus a rolling "latest"
# release. Intended for callers whose job runs `if: github.event_name ==
# 'push'` instead of the tag-gated `if: startsWith(github.ref, 'refs/tags/')`.
#
# Language-agnostic: only needs artifact_name-* files uploaded by whatever
# build workflow(s) the caller ran beforehand (Rust, Go, kernel image, ...).

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Uploaded artifact name prefix to download
        required: true
        type: string
      binary_name:
        description: Binary filename inside the artifact
        required: true
        type: string
      release_branch:
        description: Branch to commit the updated VERSION file to
        required: false
        default: ci
        type: string
      version_branch:
        description: Also commit the bumped VERSION file to this branch, as an independent commit on its own tip (e.g. the actual dev branch, when release_branch has to be a workflow-carrying branch like ci). Leave unset to only update release_branch.
        required: false
        default: ''
        type: string
      always_release:
        description: Skip the VERSION/tag scheme and always release, tagged like container-build-push (<branch>_<short-sha>_<run-number> plus a rolling latest)
        required: false
        default: false
        type: boolean
    outputs:
      version:
        description: Resolved version for this release (e.g. v1, v1-rc0, or <branch>_<short-sha>_<run-number> when always_release is set)
        value: ${{ jobs.release.outputs.version }}
      prerelease:
        description: Whether this release is a prerelease (rc)
        value: ${{ jobs.release.outputs.prerelease }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ inputs.always_release }}" == "true" ]]; then
            short_sha="$(git rev-parse --short HEAD)"
            version="${GITHUB_REF_NAME////-}_${short_sha}_${GITHUB_RUN_NUMBER}"
            echo "version=${version}"   >> "$GITHUB_OUTPUT"
            echo "prerelease=false"     >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Bootstrap: create VERSION at v0 if it does not exist yet
          [[ -f VERSION ]] || echo "v0" > VERSION
          current=$(cat VERSION)
          tag="${GITHUB_REF_NAME}"

          if [[ "$current" =~ ^v([0-9]+)-rc([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            rc="${BASH_REMATCH[2]}"
          elif [[ "$current" =~ ^v([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            rc=""
          else
            echo "Unrecognised VERSION format: $current" >&2
            exit 1
          fi

          if [[ "$tag" == rc-* ]]; then
            if [[ -n "$rc" ]]; then
              new="v${major}-rc$(( rc + 1 ))"
            else
              new="v${major}-rc0"
            fi
            prerelease="true"
            version_to_write="$new"
          elif [[ "$tag" == release-* ]]; then
            if [[ -n "$rc" ]]; then
              new="v${major}"
            else
              new="v$(( major + 1 ))"
            fi
            prerelease="false"
            # After a release, advance VERSION to the next major so the
            # following rc-* tag starts a new series (e.g. v1-rc0, not v0-rc0)
            version_to_write="v$(( major + 1 ))"
          else
            echo "Unexpected tag: $tag (expected rc-* or release-*)" >&2
            exit 1
          fi

          echo "version=${new}"                >> "$GITHUB_OUTPUT"
          echo "version_to_write=${version_to_write}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}"       >> "$GITHUB_OUTPUT"

      - name: Ensure release_branch has not moved since tagging
        if: ${{ !inputs.always_release }}
        run: |
          git fetch origin "${{ inputs.release_branch }}"
          if ! git merge-base --is-ancestor "origin/${{ inputs.release_branch }}" HEAD; then
            echo "::error::${{ inputs.release_branch }} has moved since tag ${GITHUB_REF_NAME} was created (a commit landed on ${{ inputs.release_branch }} after this tag, so pushing a VERSION bump on top of the tag would not fast-forward). Re-tag from the current tip of ${{ inputs.release_branch }} and push the tag again." >&2
            exit 1
          fi

      - name: Update VERSION and push
        if: ${{ !inputs.always_release }}
        run: |
          echo "${{ steps.ver.outputs.version_to_write }}" > VERSION
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump VERSION to ${{ steps.ver.outputs.version }}"
          git push origin "HEAD:${{ inputs.release_branch }}"
          # Tag the VERSION-bump commit with the release version so the
          # GitHub Release points to the commit that has the correct VERSION file.
          git tag "${{ steps.ver.outputs.version }}"
          git push origin "${{ steps.ver.outputs.version }}"
          git tag -f latest
          git push -f origin latest

      - name: Also commit VERSION to version_branch
        if: ${{ !inputs.always_release && inputs.version_branch != '' && inputs.version_branch != inputs.release_branch }}
        run: |
          git fetch origin "${{ inputs.version_branch }}"
          git checkout -B "${{ inputs.version_branch }}" "origin/${{ inputs.version_branch }}"
          echo "${{ steps.ver.outputs.version_to_write }}" > VERSION
          git add VERSION
          git commit -m "Bump VERSION to ${{ steps.ver.outputs.version }}"
          git push origin "HEAD:${{ inputs.version_branch }}"

      - name: Move latest tag
        if: ${{ inputs.always_release }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact_name }}-*
          merge-multiple: true
          path: ./artifacts

      - name: Show downloaded artifacts
        run: ls -lah ./artifacts

      - name: Stage versioned and latest release files
        run: |
          mkdir -p ./release-version ./release-latest
          for f in ./artifacts/*; do
            base="$(basename "$f")"
            case "$base" in
              *.tar.xz) stem="${base%.tar.xz}"; ext=".tar.xz" ;;
              *.tar.gz) stem="${base%.tar.gz}"; ext=".tar.gz" ;;
              *.zip)    stem="${base%.zip}";    ext=".zip" ;;
              *.dmg)    stem="${base%.dmg}";    ext=".dmg" ;;
              *.apk)    stem="${base%.apk}";    ext=".apk" ;;
              *)        stem="$base";           ext="" ;;
            esac
            cp "$f" "./release-version/${stem}-${{ steps.ver.outputs.version }}${ext}"
            cp "$f" "./release-latest/${stem}-latest${ext}"
          done
          chmod +x ./release-version/* ./release-latest/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ inputs.always_release && github.sha || '' }}
          name: ${{ inputs.binary_name }} ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          files: ./release-version/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/update latest Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: latest
          name: ${{ inputs.binary_name }} (latest)
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          files: ./release-latest/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
