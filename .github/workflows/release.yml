---
name: Binary Release

# VERSION file tracks the current release state:
#   v0         initial / last clean release
#   v1-rc0     release candidate series in progress
#
# Tag conventions:
#   rc-*       release candidate
#              v0      → v1-rc0   (start new rc series)
#              v1-rcN  → v1-rc(N+1)
#   release-*  full release
#              v1-rcN  → v1       (finalise; strip rc)
#              v0      → v1       (direct release without prior rc)
#
# Both paths commit the updated VERSION back to release_branch - unless
# version_branch is set (see below), in which case release_branch never
# gets a VERSION file at all.
#
# Set version_branch when release_branch has to be a branch that only
# carries CI plumbing (e.g. release_branch: ci, because tags must be cut
# from wherever the workflow files live) but VERSION should live on the
# actual development branch instead (e.g. version_branch: dev). When set,
# VERSION is read from and written to version_branch only - release_branch
# is used purely to cut the tag from and never gets a VERSION file or a
# bump commit; the release tag itself is applied directly to the commit
# that was already tagged rc-*/release-* to trigger this workflow. This is
# an independent single-file commit on version_branch's own tip - not a
# merge of release_branch's tree - so it won't drag along anything that
# only lives on release_branch.
#
# Set always_release: true to skip the VERSION/tag scheme entirely and
# instead release on every run, tagged the same way container-build-push
# tags images: <branch>_<short-sha>_<run-number>, plus a rolling "latest"
# release. Intended for callers whose job runs `if: github.event_name ==
# 'push'` instead of the tag-gated `if: startsWith(github.ref, 'refs/tags/')`.
#
# Language-agnostic: only needs artifact_name-* files uploaded by whatever
# build workflow(s) the caller ran beforehand (Rust, Go, kernel image, ...).

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Uploaded artifact name prefix to download
        required: true
        type: string
      binary_name:
        description: Binary filename inside the artifact
        required: true
        type: string
      release_branch:
        description: Branch to commit the updated VERSION file to
        required: false
        default: ci
        type: string
      version_branch:
        description: Read/write VERSION on this branch instead of release_branch (e.g. the actual dev branch, when release_branch has to be a workflow-carrying branch like ci). When set, release_branch never gets a VERSION file - only the release tag itself. Leave unset to read/write VERSION on release_branch as usual.
        required: false
        default: ''
        type: string
      always_release:
        description: Skip the VERSION/tag scheme and always release, tagged like container-build-push (<branch>_<short-sha>_<run-number> plus a rolling latest)
        required: false
        default: false
        type: boolean
      version_override:
        description: Use this exact string as the release version instead of computing one from the VERSION file (e.g. a version derived from the artifact's own upstream version). Replaces the VERSION/tag arithmetic entirely - it becomes the release tag, the release name, the versioned-channel filenames, and the value written back to VERSION. Prerelease is still decided by the rc-*/release-* trigger tag, and the "latest" channel is unaffected. Leave unset for the normal scheme.
        required: false
        default: ''
        type: string
      cargo_toml_path:
        description: Path (relative to repo root) to a Cargo.toml whose own `version` field tracks release state instead of a bare VERSION file - see compute-version.yml for how the two modes differ. Its Cargo.lock (assumed alongside it) gets its own self-referential package version entry updated to match in the same commit. Leave unset for the default VERSION-file scheme.
        required: false
        default: ''
        type: string
    outputs:
      version:
        description: Resolved version for this release (e.g. v1, v1-rc0, or <branch>_<short-sha>_<run-number> when always_release is set)
        value: ${{ jobs.release.outputs.version }}
      prerelease:
        description: Whether this release is a prerelease (rc)
        value: ${{ jobs.release.outputs.prerelease }}

permissions:
  contents: write

jobs:
  version:
    name: Version
    uses: ./.github/workflows/compute-version.yml
    with:
      version_branch: ${{ inputs.version_branch }}
      cargo_toml_path: ${{ inputs.cargo_toml_path }}
      always_release: ${{ inputs.always_release }}
      version_override: ${{ inputs.version_override }}

  release:
    name: Release
    needs: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version.outputs.version }}
      prerelease: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure release_branch has not moved since tagging
        if: ${{ !inputs.always_release }}
        env:
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          set -eu
          git fetch origin "$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "origin/${RELEASE_BRANCH}" HEAD; then
            echo "::error::${RELEASE_BRANCH} has moved since tag ${GITHUB_REF_NAME} was created (a commit landed on ${RELEASE_BRANCH} after this tag, so pushing a VERSION bump on top of the tag would not fast-forward). Re-tag from the current tip of ${RELEASE_BRANCH} and push the tag again." >&2
            exit 1
          fi

      - name: Ensure version tag does not already exist
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          git fetch origin --tags --quiet
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists. Delete it (git push origin :refs/tags/${VERSION}) or reconcile the VERSION file so this run resolves to an unused version." >&2
            exit 1
          fi

      # Everything above this point is read-only. Everything below that
      # mutates git state (VERSION commits, tags) is deliberately ordered to
      # happen only once we know there is something real to release, so a
      # failed/missing build doesn't leave a version bumped or tagged with
      # nothing to show for it - exactly the kind of drift that otherwise
      # forces manual tag cleanup before the next attempt can succeed.

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact_name }}-*
          merge-multiple: true
          path: ./artifacts

      - name: Show downloaded artifacts
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -eu
          ls -lah ./artifacts
          [ -n "$(ls -A ./artifacts 2>/dev/null)" ] || {
            echo "::error::No artifacts matched ${ARTIFACT_NAME}-* - nothing to release." >&2
            exit 1
          }

      - name: Stage versioned and latest release files
        env:
          FILE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          mkdir -p ./release-version ./release-latest
          for f in ./artifacts/*; do
            base="$(basename "$f")"
            case "$base" in
              *.tar.xz)    stem="${base%.tar.xz}";    ext=".tar.xz" ;;
              *.tar.gz)    stem="${base%.tar.gz}";    ext=".tar.gz" ;;
              *.zip)       stem="${base%.zip}";       ext=".zip" ;;
              *.dmg)       stem="${base%.dmg}";       ext=".dmg" ;;
              *.apk)       stem="${base%.apk}";       ext=".apk" ;;
              *.gpkg.tar)  stem="${base%.gpkg.tar}";  ext=".gpkg.tar" ;;
              *.sha384)    stem="${base%.sha384}";    ext=".sha384" ;;
              *)           stem="$base";              ext="" ;;
            esac
            cp "$f" "./release-version/${stem}-${FILE_VERSION}${ext}"
            cp "$f" "./release-latest/${stem}-latest${ext}"
          done
          chmod +x ./release-version/* ./release-latest/*

      - name: Configure git identity
        uses: bbusse/github-workflows/.github/actions/git-identity@dev

      # Plain mode: bump the version file on release_branch and tag that
      # commit, so the GitHub Release points at a commit whose version file
      # already reads the released version.
      - name: Bump version on release_branch
        id: bump-release-branch
        if: ${{ !inputs.always_release && inputs.version_branch == '' }}
        uses: bbusse/github-workflows/.github/actions/bump-version@dev
        with:
          version_to_write: ${{ needs.version.outputs.version_to_write }}
          cargo_toml_path: ${{ inputs.cargo_toml_path }}
          cargo_version: ${{ needs.version.outputs.cargo_version }}

      - name: Commit and tag on release_branch
        if: ${{ !inputs.always_release && inputs.version_branch == '' }}
        env:
          CHANGED_FILES: ${{ steps.bump-release-branch.outputs.changed_files }}
          SUBJECT: ${{ steps.bump-release-branch.outputs.package_name || 'VERSION' }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          set -eu
          # shellcheck disable=SC2086 # a space-separated file list
          git add $CHANGED_FILES
          git commit -m "Bump ${SUBJECT} to ${VERSION}"
          git tag "$VERSION"
          git push origin "HEAD:${RELEASE_BRANCH}"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: bbusse/github-workflows/.github/actions/gh-release@dev
        with:
          tag: ${{ needs.version.outputs.version }}
          # In plain mode the version tag already exists (just created above,
          # pointing at the bump commit) so this is ignored. In
          # always_release/version_branch mode there is no bump commit - the
          # tag doesn't exist yet, so this tells the release action to create
          # it pointing at the commit that was actually built.
          target_commitish: ${{ (inputs.always_release || inputs.version_branch != '') && github.sha || '' }}
          title: ${{ inputs.binary_name }} ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: ./release-version/*
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest tag
        run: |
          set -eu
          git tag -f latest
          git push -f origin latest

      # version_branch mode: release_branch only carries CI plumbing and never
      # gets a version file, so the bump lands on version_branch's own tip as
      # an independent single-file commit - not a merge of release_branch's
      # tree, which would drag along everything that only lives there.
      - name: Check out version_branch
        if: ${{ !inputs.always_release && inputs.version_branch != '' && inputs.version_branch != inputs.release_branch }}
        env:
          VERSION_BRANCH: ${{ inputs.version_branch }}
        run: |
          set -eu
          git fetch origin "$VERSION_BRANCH"
          git checkout -B "$VERSION_BRANCH" "origin/${VERSION_BRANCH}"

      - name: Bump version on version_branch
        id: bump-version-branch
        if: ${{ !inputs.always_release && inputs.version_branch != '' && inputs.version_branch != inputs.release_branch }}
        uses: bbusse/github-workflows/.github/actions/bump-version@dev
        with:
          version_to_write: ${{ needs.version.outputs.version_to_write }}
          cargo_toml_path: ${{ inputs.cargo_toml_path }}
          cargo_version: ${{ needs.version.outputs.cargo_version }}

      - name: Commit on version_branch
        if: ${{ !inputs.always_release && inputs.version_branch != '' && inputs.version_branch != inputs.release_branch }}
        env:
          CHANGED_FILES: ${{ steps.bump-version-branch.outputs.changed_files }}
          SUBJECT: ${{ steps.bump-version-branch.outputs.package_name || 'VERSION' }}
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_BRANCH: ${{ inputs.version_branch }}
        run: |
          set -eu
          # shellcheck disable=SC2086 # a space-separated file list
          git add $CHANGED_FILES
          git commit -m "Bump ${SUBJECT} to ${VERSION}"
          git push origin "HEAD:${VERSION_BRANCH}"

      - name: Create/update latest Release
        uses: bbusse/github-workflows/.github/actions/gh-release@dev
        with:
          tag: latest
          title: ${{ inputs.binary_name }} (latest)
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: ./release-latest/*
          github_token: ${{ secrets.GITHUB_TOKEN }}
