---
name: Build Linux Kernel

on:
  workflow_call:
    inputs:
      config:
        description: Target kernel config (e.g., kernel-config-x230)
        required: true
        type: string
      runs_on:
        description: Runner label to build on (e.g. ubuntu-latest, ubuntu-24.04-arm)
        required: false
        default: ''
        type: string
      runs-on:
        description: Deprecated, use runs_on
        required: false
        default: ubuntu-latest
        type: string
      platform:
        description: Container platform to build/extract for (e.g. linux/amd64, linux/arm64)
        required: false
        default: linux/arm64
        type: string
      kernel_ref:
        description: Branch or tag of torvalds/linux to build (e.g. master, v7.1, v7.2-rc3)
        required: false
        default: master
        type: string
    outputs:
      kernel_version:
        description: Kernel version reported by "make kernelversion" in the build container
        value: ${{ jobs.build-linux-kernel.outputs.kernel_version }}

permissions:
  contents: read
  packages: write

jobs:
  build-linux-kernel:
    name: Build Linux kernel
    runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || inputs['runs-on'] }}
    outputs:
      kernel_version: ${{ steps.kernel-version.outputs.version }}
    steps:
      - name: Aggressive cleanup
        uses: bbusse/github-workflows/.github/actions/aggressive-cleanup@dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install image-builder
        uses: bbusse/github-workflows/.github/actions/install-image-builder@dev

      - name: Build Linux Kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG: ${{ inputs.config }}
          # image-builder reads KERNEL_REF from the environment and passes it
          # to the Containerfile as a build arg
          KERNEL_REF: ${{ inputs.kernel_ref }}
        run: |
          set -eu
          BUILD_USE_CONTAINER=1 \
            image-builder build linux-kernel "$CONFIG"
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman push "ghcr.io/bbusse/linux-kernel-${CONFIG}:latest"

      # Ask the build container what it produced: bzImage, Image or zImage
      # depending on the arch, and a dtb for boards. It is still in local
      # storage after the build and its entrypoint runs sh
      - name: Resolve kernel image file name
        id: resolve-image
        shell: bash
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          set -eu
          files="$(podman run --rm "ghcr.io/bbusse/linux-kernel-${CONFIG}:latest" \
            sh -c 'cd /usr/src/linux && ls -1 bzImage-* Image-* zImage-* dtb-* 2>/dev/null || true')"
          name="$(printf '%s\n' "$files" | awk -v c="$CONFIG" \
            '$0 == "bzImage-" c || $0 == "Image-" c || $0 == "zImage-" c { print; exit }')"
          if [ -z "$name" ]; then
            echo "::error::no kernel image for ${CONFIG} in the build container" >&2
            exit 1
          fi
          dtb=false
          if printf '%s\n' "$files" | awk -v c="$CONFIG" '$0 == "dtb-" c { f = 1 } END { exit !f }'; then
            dtb=true
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "dtb=${dtb}" >> "$GITHUB_OUTPUT"

      - name: Extract build outputs from build container
        id: kernel-version
        env:
          IMAGE: ghcr.io/bbusse/linux-kernel-${{ inputs.config }}:latest
          PLATFORM: ${{ inputs.platform }}
          IMAGE_NAME: ${{ steps.resolve-image.outputs.name }}
          DTB: ${{ steps.resolve-image.outputs.dtb }}
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          files=("$IMAGE_NAME" "$IMAGE_NAME.sha384" kernel-version)
          if [ "$DTB" = "true" ]; then
              files+=("dtb-$CONFIG" "dtb-$CONFIG.sha384")
          fi
          c="$(podman create --platform "$PLATFORM" "$IMAGE")"
          trap 'podman rm "$c" >/dev/null' EXIT
          for f in "${files[@]}"; do
              podman cp "$c:/usr/src/linux/$f" .
          done
          version="$(tr -d '[:space:]' <kernel-version)"
          if [ -z "$version" ]; then
              echo "::error::kernelversion file was empty" >&2
              exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Upload kernel image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-kernel-${{ inputs.config }}
          path: |
            ${{ steps.resolve-image.outputs.name }}
            ${{ steps.resolve-image.outputs.name }}.sha384
            dtb-${{ inputs.config }}*
