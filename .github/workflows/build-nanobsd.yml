name: Build NanoBSD

on:
  workflow_call:
    inputs:
      image_builder_ref:
        description: Branch/tag for OpsBoost/image-builder
        required: false
        default: dev
        type: string
      mem:
        description: Memory for VM in MB
        required: false
        default: 4096
        type: number

permissions:
  contents: read

jobs:
  build-nanobsd:
    runs-on: ubuntu-latest
    name: Build NanoBSD (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      # arch is vmactions' own naming (x86_64/aarch64); the host
      # runner stays x86_64 either way per vmactions' own guidance
      - name: Build NanoBSD
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        id: build
        with:
          arch: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
          mem: ${{ inputs.mem }}
          usesh: true
          sync: sshfs
          sync-time: true
          run: |
            pkg install -y bash git sudo

            # Build outside the sshfs-shared workspace: buildworld/
            # installworld against a live network mount trips FreeBSD's
            # mtime-based "tried to rebuild during install" safety net
            cd /tmp
            git clone -b "${{ inputs.image_builder_ref }}" --depth 1 https://github.com/opsboost/image-builder
            sudo ./image-builder/image-builder install
            sudo image-builder build nanobsd ${{ matrix.arch }}

            cp /usr/obj/nanobsd.full/_.disk.full \
                "$GITHUB_WORKSPACE/nanobsd-${{ matrix.arch }}-full.img"

      # A static filename inside the artifact keeps the downstream boot
      # test's download step simple; the artifact name itself (which
      # carries run_number) is what disambiguates across runs
      - name: Upload NanoBSD image
        uses: actions/upload-artifact@v4
        with:
          name: nanobsd-${{ matrix.arch }}-full-${{ github.run_number }}
          path: nanobsd-${{ matrix.arch }}-full.img
