name: Build NanoBSD

on:
  workflow_call:
    inputs:
      image_builder_ref:
        description: Branch/tag for OpsBoost/image-builder
        required: false
        default: dev
        type: string
      mem:
        description: Memory for VM in MB
        required: false
        default: 4096
        type: number

permissions:
  contents: read

jobs:
  build-nanobsd:
    runs-on: ubuntu-latest
    name: Build NanoBSD
    steps:
      - name: Build NanoBSD
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        id: build
        with:
          mem: ${{ inputs.mem }}
          usesh: true
          sync: sshfs
          sync-time: true
          run: |
            pkg install -y bash git sudo
            git clone -b "${{ inputs.image_builder_ref }}" --depth 1 https://github.com/opsboost/image-builder
            sudo ./image-builder/image-builder install
            sudo image-builder build nanobsd
