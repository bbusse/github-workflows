name: Build Alpine Package

# Packages an already-built linux-*-musl binary (produced by build-rust.yml
# with musl: true) into a signed Alpine (.apk) package, using our own
# apk-builder container image (see containers/apk-builder/Containerfile and
# build-apk-builder-image.yml).

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name prefix the linux-*-musl binaries were uploaded under
        required: true
        type: string
      binary_name:
        description: Binary filename inside the artifact (also used as pkgname)
        required: true
        type: string
      version:
        description: Version to package (e.g. v1, v1-rc0); normalised into an Alpine pkgver
        required: true
        type: string
      pkgdesc:
        description: Short package description
        required: false
        default: ''
        type: string
      pkgurl:
        description: Upstream project URL
        required: false
        default: ''
        type: string
      license:
        description: SPDX license identifier
        required: false
        default: MIT
        type: string
      pkgrel:
        description: Alpine package release number
        required: false
        default: '0'
        type: string
      apk_builder_image:
        description: Container image used to run abuild
        required: false
        default: ghcr.io/bbusse/apk-builder:latest
        type: string
      key_name:
        description: Basename (no extension) the signing key is written as; consumers must trust a matching <key_name>.rsa.pub, as apk looks up the key by this exact filename
        required: false
        default: bbusse-releases
        type: string
    secrets:
      ABUILD_PRIVATE_KEY:
        description: PEM-encoded RSA private key used to sign the built .apk packages
        required: true

permissions:
  contents: read

env:
  # Set as a repo (or org) Actions variable in each calling repo, e.g.:
  #   gh variable set PACKAGER --body "Name <email>" --repo <owner>/<repo>
  PACKAGER: ${{ vars.PACKAGER }}

jobs:
  build-apk-amd64:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.apk_builder_image }}
    env:
      ALPINE_ARCH: x86_64
      ARTIFACT_SUFFIX: linux-amd64-musl
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ env.ARTIFACT_SUFFIX }}
          path: ./work

      - name: Configure signing key
        env:
          KEY_NAME: ${{ inputs.key_name }}
          ABUILD_PRIVATE_KEY: ${{ secrets.ABUILD_PRIVATE_KEY }}
        run: |
          mkdir -p /home/builder/.abuild
          printf '%s\n' "$ABUILD_PRIVATE_KEY" > "/home/builder/.abuild/$KEY_NAME.rsa"
          chmod 600 "/home/builder/.abuild/$KEY_NAME.rsa"
          openssl rsa -in "/home/builder/.abuild/$KEY_NAME.rsa" -pubout -out "/home/builder/.abuild/$KEY_NAME.rsa.pub"
          cp "/home/builder/.abuild/$KEY_NAME.rsa.pub" /etc/apk/keys/
          echo "PACKAGER_PRIVKEY=\"/home/builder/.abuild/$KEY_NAME.rsa\"" >> /home/builder/.abuild/abuild.conf
          echo "PACKAGER=\"$PACKAGER\"" >> /home/builder/.abuild/abuild.conf
          chown -R builder:abuild /home/builder/.abuild

      - name: Write APKBUILD
        working-directory: ./work
        run: |
          mv "${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}" "${{ inputs.binary_name }}"
          chmod +x "${{ inputs.binary_name }}"
          PKGVER="$(echo "${{ inputs.version }}" | sed -E 's/^[vV]//; s/-/_/g')"
          {
            echo "pkgname=${{ inputs.binary_name }}"
            echo "pkgver=$PKGVER"
            echo "pkgrel=${{ inputs.pkgrel }}"
            echo "pkgdesc=\"${{ inputs.pkgdesc || inputs.binary_name }}\""
            echo "url=\"${{ inputs.pkgurl }}\""
            echo "arch=\"$ALPINE_ARCH\""
            echo "license=\"${{ inputs.license }}\""
            echo "maintainer=\"$PACKAGER\""
            echo 'source=""'
            echo 'options="!check !strip !tracedeps"'
            echo ''
            echo 'package() {'
            echo "    install -Dm755 \"\$startdir/${{ inputs.binary_name }}\" \"\$pkgdir\"/usr/bin/${{ inputs.binary_name }}"
            echo '}'
          } > APKBUILD
          cat APKBUILD

      - name: Build package
        working-directory: ./work
        run: |
          chown -R builder:abuild .
          sudo -u builder -H sh -c 'abuild checksum && abuild -r'

      - name: Stage package
        run: |
          mkdir -p ./out
          find /home/builder/packages -name '*.apk' -exec cp {} ./out/ \;
          ls -lah ./out

      - name: Upload apk artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-apk-x86_64
          path: ./out/*.apk

  build-apk-arm64:
    # Native ARM64 hardware isn't needed here: abuild never compiles or
    # executes the target binary, it just copies the prebuilt one into a
    # package (arch=aarch64 is metadata only). Running on the same x64
    # runner as build-apk-amd64 also sidesteps GitHub's restriction that
    # JS actions in Alpine containers only work on x64 Linux runners.
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.apk_builder_image }}
    env:
      ALPINE_ARCH: aarch64
      ARTIFACT_SUFFIX: linux-arm64-musl
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ env.ARTIFACT_SUFFIX }}
          path: ./work

      - name: Configure signing key
        env:
          KEY_NAME: ${{ inputs.key_name }}
          ABUILD_PRIVATE_KEY: ${{ secrets.ABUILD_PRIVATE_KEY }}
        run: |
          mkdir -p /home/builder/.abuild
          printf '%s\n' "$ABUILD_PRIVATE_KEY" > "/home/builder/.abuild/$KEY_NAME.rsa"
          chmod 600 "/home/builder/.abuild/$KEY_NAME.rsa"
          openssl rsa -in "/home/builder/.abuild/$KEY_NAME.rsa" -pubout -out "/home/builder/.abuild/$KEY_NAME.rsa.pub"
          cp "/home/builder/.abuild/$KEY_NAME.rsa.pub" /etc/apk/keys/
          echo "PACKAGER_PRIVKEY=\"/home/builder/.abuild/$KEY_NAME.rsa\"" >> /home/builder/.abuild/abuild.conf
          echo "PACKAGER=\"$PACKAGER\"" >> /home/builder/.abuild/abuild.conf
          chown -R builder:abuild /home/builder/.abuild

      - name: Write APKBUILD
        working-directory: ./work
        run: |
          mv "${{ inputs.binary_name }}-${{ env.ARTIFACT_SUFFIX }}" "${{ inputs.binary_name }}"
          chmod +x "${{ inputs.binary_name }}"
          PKGVER="$(echo "${{ inputs.version }}" | sed -E 's/^[vV]//; s/-/_/g')"
          {
            echo "pkgname=${{ inputs.binary_name }}"
            echo "pkgver=$PKGVER"
            echo "pkgrel=${{ inputs.pkgrel }}"
            echo "pkgdesc=\"${{ inputs.pkgdesc || inputs.binary_name }}\""
            echo "url=\"${{ inputs.pkgurl }}\""
            echo "arch=\"$ALPINE_ARCH\""
            echo "license=\"${{ inputs.license }}\""
            echo "maintainer=\"$PACKAGER\""
            echo 'source=""'
            echo 'options="!check !strip !tracedeps"'
            echo ''
            echo 'package() {'
            echo "    install -Dm755 \"\$startdir/${{ inputs.binary_name }}\" \"\$pkgdir\"/usr/bin/${{ inputs.binary_name }}"
            echo '}'
          } > APKBUILD
          cat APKBUILD

      - name: Build package
        working-directory: ./work
        run: |
          chown -R builder:abuild .
          sudo -u builder -H sh -c 'CARCH=aarch64 abuild checksum && CARCH=aarch64 abuild -r'

      - name: Stage package
        run: |
          mkdir -p ./out
          find /home/builder/packages -name '*.apk' -exec cp {} ./out/ \;
          ls -lah ./out

      - name: Upload apk artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-apk-aarch64
          path: ./out/*.apk
