---
name: Build Alpine Package

# Packages an already-built linux-*-musl binary (produced by build-rust.yml
# with musl: true) into a signed Alpine (.apk) package, using our own
# apk-builder container image (see containers/apk-builder/Containerfile and
# build-apk-builder-image.yml).
#
# Set bundle_tarball: true to package a linux-*-musl.tar.gz bundle instead
# (binary + shared libs + a <binary_name>-launcher.sh entrypoint, produced
# e.g. by extracting a container image build via container-extract-artifacts.yml).
# The whole bundle is installed under /usr/lib/<binary_name>/ and
# /usr/bin/<binary_name> is symlinked to its launcher script.
#
# Set build_from_source: true to check out the calling repository and build
# its own committed APKBUILD directly (abuild compiles from source itself -
# no prebuilt artifact download, no synthesized APKBUILD, and pkgrel/pkgdesc/
# depends/etc. all come from that file, not from workflow inputs). Pass version
# to have a release's computed version replace the APKBUILD's pkgver, so both
# packaging paths name their assets the same way; leave it unset to keep the
# pkgver in the file, which is what a package tracking an upstream release wants.
# Since real compilation happens, the arm64 job runs on a native arm64
# runner rather than just relabeling an x86-built package.

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name prefix the linux-*-musl binaries were uploaded under (ignored when build_from_source is set)
        required: false
        default: ''
        type: string
      binary_name:
        description: Binary filename inside the artifact (also used as pkgname); ignored when build_from_source is set
        required: false
        default: ''
        type: string
      bundle_tarball:
        description: Package a linux-*-musl tarball bundle (binary + libs + <binary_name>-launcher.sh) instead of a bare binary
        required: false
        default: false
        type: boolean
      build_from_source:
        description: Check out this repository and build its own committed APKBUILD directly, instead of packaging a prebuilt artifact
        required: false
        default: false
        type: boolean
      working_directory:
        description: Directory (relative to the repository root) containing the APKBUILD to build. Only used when build_from_source is set.
        required: false
        default: '.'
        type: string
      version:
        description: "Version to package (e.g. v1, v1-rc0); normalised into an Alpine pkgver. With build_from_source it replaces the APKBUILD's pkgver, which suits a package versioned by its own releases; omit it to keep the file's pkgver, which is what a package tracking an upstream version needs."
        required: false
        default: ''
        type: string
      pkgdesc:
        description: Short package description (ignored when build_from_source is set)
        required: false
        default: ''
        type: string
      pkgurl:
        description: Upstream project URL (ignored when build_from_source is set)
        required: false
        default: ''
        type: string
      license:
        description: SPDX license identifier (ignored when build_from_source is set)
        required: false
        default: MIT
        type: string
      pkgrel:
        description: Alpine package release number (ignored when build_from_source is set)
        required: false
        default: '0'
        type: string
      apk_builder_image:
        description: Container image used to run abuild
        required: false
        default: ghcr.io/bbusse/apk-builder:latest
        type: string
      provides:
        description: >-
          Space-separated apk provides for the package, e.g. "/bin/sh cmd:sh".
          A package that claims a canonical path this way can satisfy other
          packages' file dependencies on it. Ignored when build_from_source is set.
        required: false
        default: ''
        type: string
      provider_priority:
        description: >-
          Priority used when several packages provide the same unversioned name;
          apk swaps the lower-priority provider out rather than reporting a
          conflict. Alpine's busybox-binsh uses 100. Ignored when build_from_source is set.
        required: false
        default: ''
        type: string
      symlinks:
        description: >-
          Space-separated <link>=<target> pairs to create in the package,
          e.g. "/bin/sh=/usr/bin/brush". Ignored when build_from_source is set.
        required: false
        default: ''
        type: string
      alt_subpackage:
        description: >-
          When set, provides/provider_priority/symlinks go into a subpackage
          named <pkgname>-<alt_subpackage> instead of the main package, which
          is how Alpine ships busybox-binsh: the plain package installs
          anywhere, and only the subpackage takes over the canonical path.
          Ignored when build_from_source is set.
        required: false
        default: ''
        type: string
      key_name:
        description: Basename (no extension) the signing key is written as; consumers must trust a matching <key_name>.rsa.pub, as apk looks up the key by this exact filename
        required: false
        default: bbusse-releases
        type: string
    secrets:
      ABUILD_PRIVATE_KEY:
        description: PEM-encoded RSA private key used to sign the built .apk packages
        required: true

permissions:
  contents: read

env:
  # Set as a repo (or org) Actions variable in each calling repo, e.g.:
  #   gh variable set PACKAGER --body "Name <email>" --repo <owner>/<repo>
  PACKAGER: ${{ vars.PACKAGER }}


jobs:
  # Packaging a prebuilt binary: abuild never compiles or executes it, it just
  # copies it into a package, so arch is metadata only (CARCH) and both arches
  # build on the same x64 runner. That also sidesteps GitHub's restriction
  # that JS actions in Alpine containers only work on x64 Linux runners.
  build-apk:
    name: Build APK ${{ matrix.arch }}
    if: ${{ !inputs.build_from_source }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.apk_builder_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            alpine_arch: x86_64
          - arch: arm64
            alpine_arch: aarch64
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}-linux-${{ matrix.arch }}-musl
          path: ./work

      - name: Configure signing key
        uses: bbusse/github-workflows/.github/actions/abuild-sign@dev
        with:
          key_name: ${{ inputs.key_name }}
          abuild_private_key: ${{ secrets.ABUILD_PRIVATE_KEY }}
          packager: ${{ env.PACKAGER }}

      - name: Write APKBUILD
        uses: bbusse/github-workflows/.github/actions/write-apkbuild@dev
        with:
          binary_name: ${{ inputs.binary_name }}
          version: ${{ inputs.version }}
          pkgrel: ${{ inputs.pkgrel }}
          pkgdesc: ${{ inputs.pkgdesc }}
          pkgurl: ${{ inputs.pkgurl }}
          license: ${{ inputs.license }}
          alpine_arch: ${{ matrix.alpine_arch }}
          artifact_suffix: linux-${{ matrix.arch }}-musl
          packager: ${{ env.PACKAGER }}
          bundle_tarball: ${{ inputs.bundle_tarball }}
          provides: ${{ inputs.provides }}
          provider_priority: ${{ inputs.provider_priority }}
          symlinks: ${{ inputs.symlinks }}
          alt_subpackage: ${{ inputs.alt_subpackage }}
          working_directory: ./work

      - name: Build package
        working-directory: ./work
        env:
          CARCH: ${{ matrix.alpine_arch }}
        run: |
          set -eu
          apk update
          chown -R builder:abuild .
          sudo -u builder -H sh -c "CARCH=$CARCH abuild checksum && CARCH=$CARCH abuild -r"

      - name: Stage package
        uses: bbusse/github-workflows/.github/actions/stage-apk@dev
        with:
          packages_dir: /home/builder/packages
          alpine_arch: ${{ matrix.alpine_arch }}

      - name: Upload apk artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name || github.event.repository.name }}-apk-${{ matrix.arch }}
          path: ./out/*.apk

  # Building from source: abuild really compiles, so each arch needs its own
  # hardware and its own mechanism. On x64 a job-level container works; on an
  # arm64 runner it can't, because GitHub doesn't support JS actions
  # (checkout, up/download-artifact) inside a container there - so that leg
  # runs the Alpine image via a manual `podman run` for the abuild step only,
  # with checkout and upload happening on the bare runner.
  build-apk-amd64-from-source:
    name: Build APK amd64 from source
    if: ${{ inputs.build_from_source }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.apk_builder_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ./work

      - name: Configure signing key
        uses: bbusse/github-workflows/.github/actions/abuild-sign@dev
        with:
          key_name: ${{ inputs.key_name }}
          abuild_private_key: ${{ secrets.ABUILD_PRIVATE_KEY }}
          packager: ${{ env.PACKAGER }}

      # One packaging path for both cases: a caller that computes a version
      # (releases do) has it win over the APKBUILD's own pkgver, so building
      # from source yields the same asset names the synthesized APKBUILD does.
      # This suits an APKBUILD that builds the checkout it ships with; one that
      # fetches a versioned source= tarball would now look for a release that
      # does not exist, so such packages should not be passed a version
      - name: Override pkgver
        if: ${{ inputs.version != '' }}
        working-directory: ./work/${{ inputs.working_directory }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          pkgver="$(printf '%s' "$VERSION" | awk '{ sub(/^[vV]/, ""); gsub(/-/, "_"); print }')"
          awk -v v="$pkgver" '
              /^pkgver=/ && !done { print "pkgver=" v; done = 1; next }
              { print }
          ' APKBUILD > APKBUILD.new
          mv APKBUILD.new APKBUILD
          grep '^pkgver=' APKBUILD

      - name: Build package
        working-directory: ./work/${{ inputs.working_directory }}
        run: |
          set -eu
          apk update
          chown -R builder:abuild "$GITHUB_WORKSPACE/work"
          sudo -u builder -H sh -c 'abuild checksum && abuild -r'

      - name: Stage package
        uses: bbusse/github-workflows/.github/actions/stage-apk@dev
        with:
          packages_dir: /home/builder/packages
          alpine_arch: x86_64

      - name: Upload apk artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name || github.event.repository.name }}-apk-amd64
          path: ./out/*.apk

  build-apk-arm64-from-source:
    name: Build APK arm64 from source
    if: ${{ inputs.build_from_source }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ./work

      - name: Configure signing key
        uses: bbusse/github-workflows/.github/actions/abuild-sign@dev
        with:
          key_name: ${{ inputs.key_name }}
          abuild_private_key: ${{ secrets.ABUILD_PRIVATE_KEY }}
          packager: ${{ env.PACKAGER }}
          abuild_home: ./abuild-home/.abuild
          in_container: 'false'

      # One packaging path for both cases: a caller that computes a version
      # (releases do) has it win over the APKBUILD's own pkgver, so building
      # from source yields the same asset names the synthesized APKBUILD does.
      # This suits an APKBUILD that builds the checkout it ships with; one that
      # fetches a versioned source= tarball would now look for a release that
      # does not exist, so such packages should not be passed a version
      - name: Override pkgver
        if: ${{ inputs.version != '' }}
        working-directory: ./work/${{ inputs.working_directory }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          pkgver="$(printf '%s' "$VERSION" | awk '{ sub(/^[vV]/, ""); gsub(/-/, "_"); print }')"
          awk -v v="$pkgver" '
              /^pkgver=/ && !done { print "pkgver=" v; done = 1; next }
              { print }
          ' APKBUILD > APKBUILD.new
          mv APKBUILD.new APKBUILD
          grep '^pkgver=' APKBUILD

      - name: Build package
        env:
          APK_BUILDER_IMAGE: ${{ inputs.apk_builder_image }}
          KEY_NAME: ${{ inputs.key_name }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -eu
          mkdir -p ./packages
          podman run --rm \
            -e PACKAGER \
            -e KEY_NAME="$KEY_NAME" \
            -v "$PWD/work:/work" \
            -v "$PWD/abuild-home/.abuild:/home/builder/.abuild" \
            -v "$PWD/packages:/home/builder/packages" \
            -w "/work/${WORKING_DIRECTORY}" \
            "$APK_BUILDER_IMAGE" \
            sh -c '
              set -e
              cp "/home/builder/.abuild/${KEY_NAME}.rsa.pub" /etc/apk/keys/
              chown -R builder:abuild /work /home/builder/.abuild /home/builder/packages
              apk update
              sudo -u builder -H sh -c "abuild checksum && abuild -r"
            '

      - name: Stage package
        uses: bbusse/github-workflows/.github/actions/stage-apk@dev
        with:
          packages_dir: ./packages
          alpine_arch: aarch64

      - name: Upload apk artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name || github.event.repository.name }}-apk-arm64
          path: ./out/*.apk
