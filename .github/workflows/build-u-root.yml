---
name: Build u-root

on:
  workflow_call:
    inputs:
      arch:
        description: Target architecture (e.g., amd64)
        required: true
        type: string
      image_name:
        description: Base image name (default gentoo-stage4)
        required: false
        default: gentoo-stage4
        type: string
      registry:
        description: Container registry (e.g., ghcr.io/bbusse)
        required: true
        type: string
      tag:
        description: Image tag to push (default latest)
        required: false
        default: latest
        type: string
      use_arm_runner:
        description: Use ARM runner (ubuntu-24.04-arm) instead of ubuntu-latest
        required: false
        default: false
        type: boolean
    secrets:
      GHCR_TOKEN:
        description: Token for pushing to container registry
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-u-root:
    name: Build u-root (${{ inputs.arch }})
    runs-on: ${{ inputs.use_arm_runner && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Aggressive cleanup
        uses: bbusse/github-workflows/.github/actions/aggressive-cleanup@dev

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout image-builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpsBoost/image-builder
          ref: dev
          path: image-builder

      - name: Build
        env:
          IMAGE_LOCAL: ${{ inputs.image_name }}
          IMAGE_REMOTE: ${{ inputs.registry }}/${{ inputs.image_name }}-${{ inputs.arch }}:${{ inputs.tag }}
          REGISTRY: ${{ inputs.registry }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -eu
          sudo ./image-builder/image-builder install
          image-builder build u-root "$ARCH"
          echo "$GHCR_TOKEN" | podman login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          podman tag "$IMAGE_LOCAL" "$IMAGE_REMOTE"
          podman push "$IMAGE_REMOTE"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: u-root-${{ inputs.arch }}
          path: output/*
