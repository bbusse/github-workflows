name: Build Gentoo Stage4

on:
  workflow_call:
    inputs:
      arch:
        description: Target architecture (e.g., amd64)
        required: true
        type: string
      flavour:
        description: Gentoo target flavour (containeros|sway)
        required: true
        type: string
      overlays:
        description: Space separated list of Portage overlay repo URLs needed by this flavour's sets
        required: false
        default: ''
        type: string
      image_name:
        description: Base image name (default gentoo-stage4)
        required: false
        default: gentoo-stage4
        type: string
      registry:
        description: Container registry (e.g., ghcr.io/bbusse)
        required: true
        type: string
      tag:
        description: Image tag to push (default latest)
        required: false
        default: latest
        type: string
      use_arm_runner:
        description: Use ARM runner (ubuntu-24.04-arm) instead of ubuntu-latest
        required: false
        default: false
        type: boolean
    secrets:
      GHCR_TOKEN:
        description: Token for pushing to container registry
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-stage4:
    name: Build Stage4 ${{ inputs.flavour }} (${{ inputs.arch }})
    runs-on: ${{ inputs.use_arm_runner && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Aggressive cleanup
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift \
                      /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android \
                      /usr/local/share/chromium /opt/microsoft /opt/google \
                      /opt/az /usr/local/share/powershell /opt/hostedtoolcache || true
          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout image-builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpsBoost/image-builder
          ref: dev
          path: image-builder

      - name: Expose GitHub Actions cache variables for buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build
        env:
          IMAGE_LOCAL: ${{ inputs.image_name }}-${{ inputs.flavour }}-${{ inputs.arch }}
          IMAGE_REMOTE: ${{ inputs.registry }}/${{ inputs.image_name }}-${{ inputs.flavour }}-${{ inputs.arch }}:${{ inputs.tag }}
          REGISTRY: ${{ inputs.registry }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GENTOO_OVERLAYS: ${{ inputs.overlays }}
          # image-builder's build_gentoo_stage4() clones gentoo-build
          # itself via a plain URL with no ref - without this it always
          # builds main's Containerfile/emerge.sh regardless of which
          # branch actually triggered this workflow
          GENTOO_BUILD_REF: ${{ github.ref_name }}
        run: |
          ls -al
          sudo ./image-builder/image-builder install
          image-builder build gentoo-${{ inputs.flavour }} ${{ inputs.arch }}
          echo "$GHCR_TOKEN" | podman login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          podman tag "$IMAGE_LOCAL" "$IMAGE_REMOTE"
          podman push "$IMAGE_REMOTE"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gentoo-stage4-${{ inputs.flavour }}-${{ inputs.arch }}
          path: gentoo-build/output/gentoo-stage4-*
