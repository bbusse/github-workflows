---
name: Flutter macOS Build

# Apple platforms cannot be built in a Linux container, so this runs
# on a macOS runner with Xcode already installed
#
# Flutter is cloned at the pinned version via install-flutter, same as
# build-flutter-android.yml
#
# The build is ad-hoc signed, distributing outside the build machine
# needs a Developer ID applied separately

on:
  workflow_call:
    inputs:
      flutter_version:
        description: Flutter ref to build with (channel name, tag, or version, e.g. stable or 3.47.2)
        required: true
        type: string
      working_directory:
        description: Directory (relative to the repository root) containing the Flutter project
        required: false
        default: '.'
        type: string
      app_name:
        description: Built .app bundle name under build/macos/Build/Products/Release (the project's PRODUCT_NAME, e.g. Eventually)
        required: true
        type: string
      build_args:
        description: Extra arguments appended to 'flutter build macos --release'
        required: false
        default: ''
        type: string
      artifact_name:
        description: Uploaded artifact name (defaults to the repository name)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flutter
        uses: bbusse/github-workflows/.github/actions/install-flutter@dev
        with:
          version: ${{ inputs.flutter_version }}
          precache_flags: --macos

      - name: Build macOS app
        working-directory: ${{ inputs.working_directory }}
        env:
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -eu
          flutter pub get
          flutter analyze
          flutter test
          # shellcheck disable=SC2086 # space-separated extra flags
          flutter build macos --release $BUILD_ARGS

      - name: Archive .app
        working-directory: ${{ inputs.working_directory }}/build/macos/Build/Products/Release
        env:
          APP_NAME: ${{ inputs.app_name }}
          ARTIFACT_NAME: ${{ inputs.artifact_name || github.event.repository.name }}
        run: |
          set -eu
          ditto -c -k --sequesterRsrc --keepParent "${APP_NAME}.app" "${ARTIFACT_NAME}-macos.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name || github.event.repository.name }}-macos
          path: ${{ inputs.working_directory }}/build/macos/Build/Products/Release/${{ inputs.artifact_name || github.event.repository.name }}-macos.zip
